<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEOレポーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #2c6fad;
      color: white;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-dots { display: flex; gap: 5px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; }

    header h1 { font-size: 20px; font-weight: 700; cursor: pointer; }
    header h1:hover { opacity: 0.85; }

    .breadcrumb {
      font-size: 13px;
      opacity: 0.75;
      margin-left: 8px;
      display: none;
    }
    .breadcrumb.visible { display: block; }

    header .spacer { flex: 1; }

    .header-api {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .header-api input {
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      width: 220px;
      font-family: monospace;
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .header-api input::placeholder { color: rgba(255,255,255,0.5); }
    .header-api input:focus { outline: none; background: rgba(255,255,255,0.25); }

    .api-saved { font-size: 11px; color: #a8f0c6; display: none; }
    .api-saved.show { display: block; }

    /* ── Pages ── */
    .page { display: none; max-width: 860px; margin: 0 auto; padding: 28px 20px; }
    .page.active { display: block; }

    /* ── Store List Page ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .page-header h2 { font-size: 20px; color: #1a3c5e; }

    .btn-primary {
      background: #2c6fad;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #1a5490; }

    .btn-danger {
      background: none;
      color: #e53935;
      border: 1.5px solid #e53935;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-danger:hover { background: #e53935; color: white; }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .store-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      position: relative;
    }

    .store-card:hover { border-color: #2c6fad; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(44,111,173,0.15); }

    .store-card h3 { font-size: 15px; color: #1a3c5e; margin-bottom: 8px; }

    .store-card .meta {
      font-size: 12px;
      color: #888;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .store-card .report-badge {
      display: inline-block;
      background: #e8f0fe;
      color: #2c6fad;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 10px;
    }

    .store-card .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
      transition: color 0.2s;
    }
    .store-card .delete-btn:hover { color: #e53935; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── Add Store Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: white;
      border-radius: 14px;
      padding: 28px;
      width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .modal h3 { font-size: 16px; color: #1a3c5e; margin-bottom: 16px; }

    .modal input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #dde3ed;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      margin-bottom: 16px;
    }
    .modal input[type="text"]:focus { border-color: #2c6fad; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    .btn-secondary {
      background: none;
      color: #666;
      border: 1.5px solid #ddd;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary:hover { background: #f5f5f5; }

    /* ── Store Detail Page ── */
    .store-detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #2c6fad;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #e8f0fe; }

    .store-detail-header h2 { font-size: 20px; color: #1a3c5e; flex: 1; }

    /* ── Report Form Card ── */
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 15px;
      color: #1a3c5e;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8f0fe;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }

    label { font-size: 12px; color: #666; font-weight: 600; }

    select, input[type="number"] {
      padding: 9px 12px;
      border: 1.5px solid #dde3ed;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    select:focus, input[type="number"]:focus { border-color: #2c6fad; }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .upload-box {
      border: 2px dashed #c5d5e8;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: #f8fafd;
    }
    .upload-box:hover, .upload-box.dragover { border-color: #2c6fad; background: #eef4fb; }
    .upload-box.has-file { border-color: #34a853; background: #f0faf3; border-style: solid; }

    .upload-box input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-box .icon { font-size: 22px; margin-bottom: 4px; }
    .upload-box h4 { font-size: 12px; color: #333; font-weight: 700; margin-bottom: 2px; }
    .upload-box p { font-size: 10px; color: #999; }
    .upload-box .file-name { font-size: 11px; color: #34a853; font-weight: 600; margin-top: 4px; display: none; word-break: break-all; }
    .upload-box.has-file .file-name { display: block; }
    .upload-box.has-file .upload-hint { display: none; }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: #2c6fad;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .generate-btn:hover { background: #1a5490; }
    .generate-btn:disabled { background: #aac4de; cursor: not-allowed; }

    .status-area { display: none; margin-top: 14px; }
    .status-area.visible { display: block; }

    .progress-bar-wrap { background: #e8f0fe; border-radius: 8px; height: 6px; overflow: hidden; margin-bottom: 10px; }
    .progress-bar { height: 100%; background: #2c6fad; border-radius: 8px; width: 0%; transition: width 0.5s; }

    .status-log {
      background: #1e2a38;
      color: #a8d4a8;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.8;
      min-height: 60px;
      max-height: 160px;
      overflow-y: auto;
    }
    .status-log .error { color: #ff8a80; }
    .status-log .success { color: #69f0ae; }

    /* ── Report History ── */
    .report-list { display: flex; flex-direction: column; gap: 10px; }

    .report-item {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      gap: 14px;
    }

    .report-item .report-icon { font-size: 24px; }

    .report-item .report-info { flex: 1; }
    .report-item .report-info .title { font-size: 14px; font-weight: 700; color: #1a3c5e; }
    .report-item .report-info .date { font-size: 12px; color: #999; margin-top: 2px; }

    .report-item .dl-btn {
      background: #e8f0fe;
      color: #2c6fad;
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      text-decoration: none;
    }
    .report-item .dl-btn:hover { background: #d0e4f8; }

    .report-item .del-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .report-item .del-btn:hover { color: #e53935; }
  </style>
</head>
<body>

<header>
  <div class="logo-dots">
    <div class="dot" style="background:#4285F4"></div>
    <div class="dot" style="background:#EA4335"></div>
    <div class="dot" style="background:#FBBC05"></div>
    <div class="dot" style="background:#34A853"></div>
  </div>
  <h1 onclick="showPage('stores')">MEOレポーター</h1>
  <span class="breadcrumb" id="breadcrumb"></span>
  <div class="spacer"></div>
  <div class="header-api">
    <span>APIキー</span>
    <input type="password" id="apiKey" placeholder="sk-ant-..." oninput="saveApiKey()">
    <span class="api-saved" id="apiSaved">保存済み</span>
  </div>
</header>

<!-- ── Page: Store List ── -->
<div class="page active" id="page-stores">
  <div class="page-header">
    <h2>対策店舗一覧</h2>
    <button class="btn-primary" onclick="showAddStoreModal()">＋ 店舗を追加</button>
  </div>
  <div class="store-grid" id="storeGrid"></div>
</div>

<!-- ── Page: Store Detail ── -->
<div class="page" id="page-detail">
  <div class="store-detail-header">
    <button class="back-btn" onclick="showPage('stores')">← 一覧に戻る</button>
    <h2 id="detailStoreName"></h2>
    <button class="btn-primary" onclick="scrollToForm()">＋ 新規レポート生成</button>
  </div>

  <!-- Report history -->
  <div class="card">
    <h3>レポート履歴</h3>
    <div class="report-list" id="reportList">
      <div class="empty-state">
        <div class="icon">📄</div>
        <p>まだレポートがありません</p>
      </div>
    </div>
  </div>

  <!-- Generate form -->
  <div class="card" id="generateForm">
    <h3>新規レポート生成</h3>
    <div class="form-row">
      <div class="form-group">
        <label>対象月</label>
        <select id="month"></select>
      </div>
      <div class="form-group">
        <label>対象年</label>
        <input type="number" id="year" min="2020" max="2030">
      </div>
    </div>

    <div class="upload-grid">
      <div class="upload-box" id="box-keyword">
        <input type="file" accept="image/*" onchange="onFileSelected(this,'keyword')">
        <div class="icon">📊</div>
        <h4>キーワード順位</h4>
        <p class="upload-hint">PNG / JPG</p>
        <p class="file-name" id="name-keyword"></p>
      </div>
      <div class="upload-box" id="box-views">
        <input type="file" accept="image/*" onchange="onFileSelected(this,'views')">
        <div class="icon">👁️</div>
        <h4>閲覧ユーザー数</h4>
        <p class="upload-hint">PNG / JPG</p>
        <p class="file-name" id="name-views"></p>
      </div>
      <div class="upload-box" id="box-interactions">
        <input type="file" accept="image/*" onchange="onFileSelected(this,'interactions')">
        <div class="icon">🔄</div>
        <h4>インタラクション数</h4>
        <p class="upload-hint">PNG / JPG</p>
        <p class="file-name" id="name-interactions"></p>
      </div>
      <div class="upload-box" id="box-userActions">
        <input type="file" accept="image/*" onchange="onFileSelected(this,'userActions')">
        <div class="icon">📍</div>
        <h4>ユーザー行動データ</h4>
        <p class="upload-hint">PNG / JPG</p>
        <p class="file-name" id="name-userActions"></p>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateReport()">レポートを生成する</button>

    <div class="status-area" id="statusArea">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="status-log" id="statusLog"></div>
    </div>
  </div>
</div>

<!-- ── Add Store Modal ── -->
<div class="modal-overlay" id="addStoreModal">
  <div class="modal">
    <h3>店舗を追加</h3>
    <input type="text" id="newStoreName" placeholder="例：○○整骨院 名古屋駅前店"
      onkeydown="if(event.key==='Enter') addStore()">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn-primary" onclick="addStore()">追加</button>
    </div>
  </div>
</div>

<script>
  let currentStoreId = null;
  let currentStoreName = '';

  // ── Init ──
  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    document.getElementById('apiSaved').classList.add('show');
  }

  const now = new Date();
  const monthSel = document.getElementById('month');
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m + '月';
    if (m === now.getMonth() + 1) opt.selected = true;
    monthSel.appendChild(opt);
  }
  document.getElementById('year').value = now.getFullYear();

  function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('anthropic_api_key', key);
    const badge = document.getElementById('apiSaved');
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 2000);
  }

  // ── Pages ──
  function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('breadcrumb').classList.remove('visible');
    if (page === 'stores') loadStores();
  }

  function showStoreDetail(storeId, storeName) {
    currentStoreId = storeId;
    currentStoreName = storeName;
    document.getElementById('detailStoreName').textContent = storeName;
    document.getElementById('breadcrumb').textContent = '/ ' + storeName;
    document.getElementById('breadcrumb').classList.add('visible');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-detail').classList.add('active');
    loadReports(storeId);
    resetForm();
  }

  function scrollToForm() {
    document.getElementById('generateForm').scrollIntoView({ behavior: 'smooth' });
  }

  // ── Store API ──
  async function loadStores() {
    const stores = await fetch('/api/stores').then(r => r.json());
    const grid = document.getElementById('storeGrid');
    if (stores.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🏪</div>
        <p>まだ店舗が登録されていません</p>
        <p style="margin-top:8px">「店舗を追加」から登録してください</p>
      </div>`;
      return;
    }
    grid.innerHTML = stores.map(s => `
      <div class="store-card" onclick="showStoreDetail('${s.id}', '${escHtml(s.name)}')">
        <button class="delete-btn" onclick="event.stopPropagation(); deleteStore('${s.id}', '${escHtml(s.name)}')">×</button>
        <h3>${escHtml(s.name)}</h3>
        <div class="meta">
          <span>登録日: ${formatDate(s.createdAt)}</span>
          ${s.latestReport ? `<span>最終レポート: ${s.latestReport.year}年${s.latestReport.month}月</span>` : ''}
        </div>
        <span class="report-badge">レポート ${s.reportCount}件</span>
      </div>
    `).join('');
  }

  function showAddStoreModal() {
    document.getElementById('newStoreName').value = '';
    document.getElementById('addStoreModal').classList.add('show');
    setTimeout(() => document.getElementById('newStoreName').focus(), 100);
  }

  function closeModal() {
    document.getElementById('addStoreModal').classList.remove('show');
  }

  async function addStore() {
    const name = document.getElementById('newStoreName').value.trim();
    if (!name) return;
    await fetch('/api/stores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    closeModal();
    loadStores();
  }

  async function deleteStore(id, name) {
    if (!confirm(`「${name}」を削除しますか？\n（関連するレポートもすべて削除されます）`)) return;
    await fetch(`/api/stores/${id}`, { method: 'DELETE' });
    loadStores();
  }

  // ── Report API ──
  async function loadReports(storeId) {
    const reports = await fetch(`/api/stores/${storeId}/reports`).then(r => r.json());
    const list = document.getElementById('reportList');
    if (reports.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">📄</div><p>まだレポートがありません</p></div>`;
      return;
    }
    list.innerHTML = reports.map(r => `
      <div class="report-item">
        <span class="report-icon">📊</span>
        <div class="report-info">
          <div class="title">${r.year}年${r.month}月度 MEO対策レポート</div>
          <div class="date">生成日時: ${formatDateTime(r.generatedAt)}</div>
        </div>
        <a class="dl-btn" href="/api/reports/${r.id}/download" download>📥 ダウンロード</a>
        <button class="del-btn" onclick="deleteReport('${r.id}')">×</button>
      </div>
    `).join('');
  }

  async function deleteReport(id) {
    if (!confirm('このレポートを削除しますか？')) return;
    await fetch(`/api/reports/${id}`, { method: 'DELETE' });
    loadReports(currentStoreId);
  }

  // ── Generate ──
  function onFileSelected(input, type) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById('box-' + type).classList.add('has-file');
    document.getElementById('name-' + type).textContent = file.name;
  }

  function resetForm() {
    ['keyword', 'views', 'interactions', 'userActions'].forEach(t => {
      const box = document.getElementById('box-' + t);
      box.classList.remove('has-file');
      document.getElementById('name-' + t).textContent = '';
      box.querySelector('input[type=file]').value = '';
    });
    document.getElementById('statusArea').classList.remove('visible');
    document.getElementById('statusLog').innerHTML = '';
    document.getElementById('progressBar').style.width = '0%';
  }

  function log(msg, type = 'info') {
    const el = document.getElementById('statusLog');
    const line = document.createElement('div');
    line.className = type;
    line.textContent = '> ' + msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  async function generateReport() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { alert('画面上部のAPIキーを入力してください'); return; }

    const month = document.getElementById('month').value;
    const year = document.getElementById('year').value;

    const formData = new FormData();
    formData.append('storeName', currentStoreName);
    formData.append('storeId', currentStoreId);
    formData.append('month', month);
    formData.append('year', year);
    formData.append('apiKey', apiKey);

    const types = ['keyword', 'views', 'interactions', 'userActions'];
    let hasFile = false;
    for (const t of types) {
      const input = document.querySelector(`#box-${t} input[type=file]`);
      if (input.files[0]) { formData.append(t, input.files[0]); hasFile = true; }
    }

    if (!hasFile) { alert('スクショを1枚以上アップロードしてください'); return; }

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = '生成中...';
    document.getElementById('statusArea').classList.add('visible');
    document.getElementById('statusLog').innerHTML = '';
    document.getElementById('progressBar').style.width = '10%';

    log(`${currentStoreName} ${year}年${month}月度レポートを生成中...`);

    try {
      document.getElementById('progressBar').style.width = '30%';
      log('Claude AI がスクリーンショットを解析中...');

      const res = await fetch('/api/generate', { method: 'POST', body: formData });
      document.getElementById('progressBar').style.width = '85%';

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'サーバーエラー');
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const filename = `MEO対策レポート_${currentStoreName}_${year}年${month}月.pptx`;
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);

      document.getElementById('progressBar').style.width = '100%';
      log('✅ 生成完了！ダウンロードが始まります。', 'success');

      // Refresh report list
      setTimeout(() => loadReports(currentStoreId), 500);

    } catch (err) {
      log('❌ ' + err.message, 'error');
      document.getElementById('progressBar').style.width = '0%';
    } finally {
      btn.disabled = false;
      btn.textContent = 'レポートを生成する';
    }
  }

  // ── Helpers ──
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }

  function formatDateTime(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // Drag & drop
  document.querySelectorAll('.upload-box').forEach(box => {
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('dragover'); });
    box.addEventListener('dragleave', () => box.classList.remove('dragover'));
    box.addEventListener('drop', e => {
      e.preventDefault(); box.classList.remove('dragover');
      const input = box.querySelector('input[type=file]');
      if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
    });
  });

  // Modal close on backdrop click
  document.getElementById('addStoreModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Initial load
  loadStores();
</script>
</body>
</html>
