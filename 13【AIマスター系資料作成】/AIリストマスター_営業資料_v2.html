<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AIリストマスター 営業資料</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --N:#1C2D4A;--B:#1E5CF6;--BL:#4A8FE8;
  --BG:#EEF5FF;--W:#fff;--G:#D4A521;
  --S:rgba(28,45,74,.6);--XS:rgba(28,45,74,.38);
}
html,body{width:100%;height:100%;background:#111827;
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;
  overflow:hidden;user-select:none;}
#scaler{position:fixed;top:0;left:0;width:960px;height:720px;transform-origin:top left;}
.slide{position:absolute;inset:0;width:960px;height:720px;overflow:hidden;background:#fff;
  opacity:0;pointer-events:none;transition:opacity .35s;}
.slide.active{opacity:1;pointer-events:all;}

/* ── Toolbar ── */
#toolbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:200;}
#toolbar button{padding:5px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(17,24,39,.88);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;}
#toolbar button:hover{background:rgba(30,92,246,.6);}
#toolbar button.active{background:var(--B);}
#counter{position:fixed;top:10px;right:16px;color:rgba(255,255,255,.4);font-size:12px;z-index:200;}
.nb{position:fixed;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.2);
  border:1.5px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;
  font-size:18px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;transition:.2s;}
.nb:hover{background:rgba(30,92,246,.55);}
#btn-prev{left:8px;}#btn-next{right:8px;}
#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:200;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.25s;}
.dot.active{background:#fff;transform:scale(1.4);}
.e{outline:none;}
body.em .e{outline:1.5px dashed rgba(30,92,246,.5);cursor:text;border-radius:2px;}
body.em .e:focus{outline:2px solid var(--B);background:rgba(30,92,246,.05);}

/* ━━━━━━━━━━━━━━━━━━━━━━━
   S1: 表紙
━━━━━━━━━━━━━━━━━━━━━━━ */
.s1{background:#fff;}

/* 右上デコ */
.s1 .dtr1{position:absolute;top:0;right:0;width:280px;height:200px;
  background:rgba(148,192,255,.12);clip-path:polygon(38% 0%,100% 0%,100% 100%,0% 100%);}
.s1 .dtr2{position:absolute;top:0;right:0;width:220px;height:155px;
  background:rgba(100,160,255,.2);clip-path:polygon(48% 0%,100% 0%,100% 100%,0% 100%);}
.s1 .dtr3{position:absolute;top:0;right:0;width:165px;height:115px;
  background:rgba(60,130,255,.32);clip-path:polygon(58% 0%,100% 0%,100% 100%,0% 100%);}
.s1 .dtr4{position:absolute;top:0;right:0;width:118px;height:82px;
  background:rgba(30,92,246,.42);clip-path:polygon(68% 0%,100% 0%,100% 100%,0% 100%);}

/* ロゴ */
.s1 .logo{position:absolute;top:22px;left:28px;display:flex;align-items:center;gap:9px;z-index:20;}
.s1 .logo-t{font-size:16px;font-weight:700;color:var(--N);}

/* 左コンテンツ */
.s1 .lc{position:absolute;top:72px;left:28px;width:400px;z-index:10;}
.s1 .sub{font-size:13.5px;font-weight:500;color:var(--N);margin-bottom:8px;}
.s1 .title{font-size:58px;font-weight:900;color:var(--N);line-height:1.08;letter-spacing:-.02em;margin-bottom:14px;}
.s1 .title .ai{color:var(--B);}
.s1 .badge{
  display:inline-block;background:var(--B);color:#fff;
  font-size:13px;font-weight:700;padding:9px 20px;
  border-radius:7px;letter-spacing:.03em;margin-bottom:30px;}
.s1 .feats{list-style:none;display:flex;flex-direction:column;gap:20px;}
.s1 .feats li{display:flex;align-items:center;gap:14px;font-size:15.5px;font-weight:700;color:var(--N);}
.s1 .fic{width:46px;height:46px;border-radius:50%;background:var(--N);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
.s1 .fic svg{width:22px;height:22px;}

/* 都市シルエット */
.s1 .city{position:absolute;bottom:162px;left:0;width:480px;height:190px;
  pointer-events:none;z-index:1;opacity:.5;}

/* ラップトップ領域 */
.s1 .rc{position:absolute;top:44px;right:-10px;width:545px;height:510px;z-index:10;}

/* 下部統計バー */
.s1 .bot{
  position:absolute;bottom:0;left:0;right:0;height:162px;
  background:#F6F9FF;border-top:1.5px solid rgba(28,45,74,.1);
  display:flex;align-items:center;padding:0 36px;z-index:10;}
.s1 .stats{display:flex;align-items:center;flex:1;gap:0;}
.s1 .stat{
  display:flex;flex-direction:column;align-items:center;
  flex:1;padding:0 8px;position:relative;}
.s1 .stat::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:1px;height:64px;background:rgba(28,45,74,.14);}
.s1 .stat:last-child::after{display:none;}
.s1 .stat-inner{display:flex;align-items:center;gap:4px;margin-bottom:5px;}
.s1 .sn{font-size:44px;font-weight:900;color:var(--B);line-height:1;}
.s1 .su{font-size:24px;font-weight:900;color:var(--B);align-self:flex-end;padding-bottom:3px;}
.s1 .sl{font-size:11px;color:var(--S);font-weight:500;}
.s1 .sec{display:flex;align-items:center;gap:12px;padding-left:28px;
  border-left:1px solid rgba(28,45,74,.14);max-width:195px;}
.s1 .sec-t{font-size:13px;font-weight:700;color:var(--N);display:block;margin-bottom:4px;}
.s1 .sec-s{font-size:10.5px;color:var(--S);line-height:1.7;}
.s1 .fn{position:absolute;bottom:5px;left:36px;font-size:10px;color:var(--XS);z-index:11;}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  const sl=document.querySelectorAll('.slide'),
        nv=document.getElementById('nav'),
        ct=document.getElementById('counter'),
        sc=document.getElementById('scaler'),N=sl.length;
  let c=0;
  sl.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===0?' active':'');
    d.onclick=()=>go(i);nv.appendChild(d);
  });
  function go(n){
    sl[c].classList.remove('active');nv.children[c].classList.remove('active');
    c=((n%N)+N)%N;
    sl[c].classList.add('active');nv.children[c].classList.add('active');
    ct.textContent=(c+1)+' / '+N;
  }
  window.nextSlide=()=>go(c+1);
  window.prevSlide=()=>go(c-1);
  document.addEventListener('keydown',e=>{
    if(document.body.classList.contains('em')&&document.activeElement?.isContentEditable)return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown')go(c+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(c-1);
  });
  function scale(){
    const s=Math.min(window.innerWidth/960,window.innerHeight/720),
          x=(window.innerWidth-960*s)/2,
          y=(window.innerHeight-720*s)/2;
    sc.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  }
  scale();window.addEventListener('resize',scale);

  window.toggleEdit=function(){
    const b=document.body,btn=document.getElementById('btn-edit'),
          els=document.querySelectorAll('.e');
    if(b.classList.contains('em')){
      b.classList.remove('em');
      els.forEach(e=>e.removeAttribute('contenteditable'));
      btn.classList.remove('active');btn.textContent='編集モード';
    }else{
      b.classList.add('em');
      els.forEach(e=>e.setAttribute('contenteditable','true'));
      btn.classList.add('active');btn.textContent='編集終了';
    }
  };

  window.saveHTML=function(){
    const blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],
      {type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='AIリストマスター_営業資料_v2.html';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  window.exportPDF=async function(){
    const btn=document.getElementById('btn-pdf');
    btn.textContent='生成中...';btn.disabled=true;
    const {jsPDF}=window.jspdf;
    const W=960,H=720;
    const pdf=new jsPDF({orientation:'landscape',unit:'pt',format:[W,H]});
    const orig=c;
    const saved=sc.style.transform;
    sc.style.transform='translate(0px,0px) scale(1)';
    document.body.style.overflow='visible';
    await new Promise(r=>setTimeout(r,100));
    for(let i=0;i<N;i++){
      sl.forEach(s=>{s.style.opacity='0';s.style.pointerEvents='none';});
      sl[i].style.opacity='1';sl[i].style.pointerEvents='all';
      await new Promise(r=>setTimeout(r,200));
      const canvas=await html2canvas(sl[i],{
        scale:2,useCORS:true,allowTaint:true,
        width:960,height:720,windowWidth:960,windowHeight:720,
        x:0,y:0,scrollX:0,scrollY:0,backgroundColor:'#ffffff',logging:false,
        ignoreElements:el=>el.id==='toolbar'||el.id==='nav'||el.id==='counter'||el.classList.contains('nb')
      });
      const img=canvas.toDataURL('image/jpeg',0.96);
      if(i>0)pdf.addPage([W,H],'landscape');
      pdf.addImage(img,'JPEG',0,0,W,H,undefined,'FAST');
    }
    sc.style.transform=saved;
    document.body.style.overflow='';
    sl.forEach(s=>{s.style.opacity='';s.style.pointerEvents='';});
    go(orig);
    pdf.save('AIリストマスター_営業資料_v2.pdf');
    btn.textContent='PDFで保存';btn.disabled=false;
  };
})();
</script>
