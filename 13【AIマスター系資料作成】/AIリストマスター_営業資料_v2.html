<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;height:100%;
  background:#0f1923;
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;
  overflow:hidden;user-select:none;
}

/* ── スケーラー ── */
#scaler{
  position:fixed;top:0;left:0;
  transform-origin:top left;
}
.slide{
  position:absolute;top:0;left:0;
  overflow:hidden;background:#fff;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
.slide.active{opacity:1;pointer-events:all;}

/* 背景画像 */
.slide .bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain; /* 全体を見せる（余白は白） */
  background:#fff;
  display:block;
  pointer-events:none;
}

/* ── ツールバー ── */
#toolbar{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:300;
}
#toolbar button{
  padding:5px 14px;border-radius:20px;
  border:1.5px solid rgba(255,255,255,.2);
  background:rgba(15,25,35,.9);color:#fff;
  font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;
}
#toolbar button:hover{background:rgba(30,92,246,.7);}
#toolbar button.active{background:#1E5CF6;border-color:#1E5CF6;}
#counter{
  position:fixed;top:10px;right:16px;
  color:rgba(255,255,255,.4);font-size:12px;z-index:300;
}
.nb{
  position:fixed;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.2);
  color:#fff;width:38px;height:38px;border-radius:50%;
  font-size:16px;cursor:pointer;z-index:300;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.nb:hover{background:rgba(30,92,246,.6);}
#btn-prev{left:8px;}#btn-next{right:8px;}
#nav{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;z-index:300;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.3);cursor:pointer;transition:.25s;
}
.dot.active{background:#fff;transform:scale(1.4);}

/* ── 編集レイヤー ── */
/* 通常時: 透明（元画像のみ表示） */
.et{
  position:absolute;
  background:transparent;
  color:transparent;
  border:none;outline:none;
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;
  white-space:nowrap;
  cursor:default;
  z-index:10;
}
/* 編集済み: 常に内容を表示 */
.et.modified{
  color:inherit;
  background:rgba(255,255,255,.92);
}
/* 編集モード時: 枠を表示して編集可能に */
body.em .et{
  background:rgba(255,255,255,.88)!important;
  color:inherit!important;
  border:1.5px dashed rgba(30,92,246,.5)!important;
  border-radius:3px;
  cursor:text;
}
body.em .et:focus{
  border-color:#1E5CF6!important;
  background:rgba(240,247,255,.95)!important;
  outline:none;
}
/* 白背景スライド用（文字色を確保） */
.et.dark{ color:transparent; }
.et.dark.modified,.et.dark.modified:focus{ color:#1C2D4A; }
body.em .et.dark{ color:#1C2D4A!important; }
.et.light{ color:transparent; }
.et.light.modified,.et.light.modified:focus{ color:#fff; }
body.em .et.light{ color:#fff!important; background:rgba(30,50,80,.7)!important; }
body.em .et.light:focus{ background:rgba(13,27,74,.85)!important; }

/* 長文（折り返しあり） */
.et.wrap{ white-space:pre-wrap; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  const sl = document.querySelectorAll('.slide');
  const nv = document.getElementById('nav');
  const ct = document.getElementById('counter');
  const sc = document.getElementById('scaler');
  const N  = sl.length;
  let   c  = 0;

  // ドットナビゲーション生成
  sl.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot'+(i===0?' active':'');
    d.onclick = ()=>go(i);
    nv.appendChild(d);
  });

  // スライドサイズ取得
  function slideSize(i){
    return {
      w: parseInt(sl[i].dataset.w)||960,
      h: parseInt(sl[i].dataset.h)||640
    };
  }

  // スケール計算
  function rescale(){
    const {w,h} = slideSize(c);
    const margin = 56; // toolbar + nav 分
    const s = Math.min(window.innerWidth/w, (window.innerHeight-margin)/h);
    const x = (window.innerWidth - w*s)/2;
    const y = ((window.innerHeight-margin) - h*s)/2 + margin/2;
    sc.style.width  = w+'px';
    sc.style.height = h+'px';
    // 全スライドのサイズを現在のものに合わせる（非表示なので問題なし）
    sl.forEach(s2 => {
      s2.style.width  = w+'px';
      s2.style.height = h+'px';
    });
    // ただし各スライドの.bgはobject-fit:fillなので元のサイズ比率で表示される
    sc.style.transform = `translate(${x}px,${y}px) scale(${s})`;
  }

  // スライド切り替え
  function go(n){
    sl[c].classList.remove('active');
    nv.children[c].classList.remove('active');
    c = ((n%N)+N)%N;
    sl[c].classList.add('active');
    nv.children[c].classList.add('active');
    ct.textContent = (c+1)+' / '+N;
    rescale();
  }
  window.nextSlide = ()=>go(c+1);
  window.prevSlide = ()=>go(c-1);

  rescale();
  window.addEventListener('resize', rescale);

  // キーボード
  document.addEventListener('keydown', e=>{
    if(document.body.classList.contains('em') && document.activeElement?.isContentEditable) return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown') go(c+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')   go(c-1);
  });

  // 編集モード
  window.toggleEdit = function(){
    const b   = document.body;
    const btn = document.getElementById('btn-edit');
    const els = document.querySelectorAll('.et');
    if(b.classList.contains('em')){
      b.classList.remove('em');
      els.forEach(e=>{
        e.removeAttribute('contenteditable');
        // 内容があれば modified クラスを付与
        if(e.textContent.trim()) e.classList.add('modified');
      });
      btn.classList.remove('active');
      btn.textContent = '編集モード';
    } else {
      b.classList.add('em');
      els.forEach(e=>e.setAttribute('contenteditable','true'));
      btn.classList.add('active');
      btn.textContent = '編集終了';
    }
  };

  // HTML保存
  window.saveHTML = function(){
    const blob = new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],
      {type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'AIリストマスター_営業資料_v2.html';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  // PDF出力
  window.exportPDF = async function(){
    const btn = document.getElementById('btn-pdf');
    btn.textContent = '生成中...'; btn.disabled = true;
    const { jsPDF } = window.jspdf;
    const orig = c;
    const saved = sc.style.transform;
    document.body.style.overflow = 'visible';

    // まず全サイズを取得
    const sizes = Array.from({length:N},(_,i)=>slideSize(i));
    let pdf = null;

    for(let i=0; i<N; i++){
      const {w,h} = sizes[i];
      // スケーラーをリセットしてスライドを実寸で表示
      sc.style.width   = w+'px';
      sc.style.height  = h+'px';
      sc.style.transform = 'translate(0px,0px) scale(1)';
      sl.forEach(s2=>{ s2.style.opacity='0'; s2.style.pointerEvents='none'; s2.style.width=w+'px'; s2.style.height=h+'px'; });
      sl[i].style.opacity='1'; sl[i].style.pointerEvents='all';
      await new Promise(r=>setTimeout(r,250));

      const canvas = await html2canvas(sl[i],{
        scale:2, useCORS:true, allowTaint:true,
        width:w, height:h,
        windowWidth:w, windowHeight:h,
        x:0, y:0, scrollX:0, scrollY:0,
        backgroundColor:'#ffffff', logging:false,
        ignoreElements: el=>
          el.id==='toolbar'||el.id==='nav'||
          el.id==='counter'||el.classList.contains('nb')
      });
      const img = canvas.toDataURL('image/jpeg', 0.96);

      if(!pdf){
        pdf = new jsPDF({orientation:'landscape', unit:'pt', format:[w,h]});
      } else {
        pdf.addPage([w,h],'landscape');
      }
      pdf.addImage(img,'JPEG',0,0,w,h,undefined,'FAST');
    }

    sc.style.transform = saved;
    document.body.style.overflow = '';
    sl.forEach(s2=>{ s2.style.opacity=''; s2.style.pointerEvents=''; });
    go(orig);
    pdf.save('AIリストマスター_営業資料_v2.pdf');
    btn.textContent = 'PDFで保存'; btn.disabled = false;
  };

  // 初期スライドをアクティブ化
  sl[0].classList.add('active');
  nv.children[0]?.classList.add('active');
})();
</script>
