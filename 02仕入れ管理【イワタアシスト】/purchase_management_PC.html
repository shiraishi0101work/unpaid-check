<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イワタアシスト【ウェブ仕入れ管理】</title>
<style>
  /* ===== DESIGN TOKENS ===== */
  :root {
    --brand:       #00A89D;
    --brand-dark:  #007F77;
    --brand-light: #E0F5F4;
    --brand-mid:   #00C4B8;
    --bg:          #F4F7F7;
    --surface:     #FFFFFF;
    --border:      #D8E4E3;
    --text:        #1A2A29;
    --text-sub:    #5A7170;
    --text-hint:   #9AB5B3;
    --success-bg:  #E6F7F0;
    --success-tx:  #1A7A50;
    --warn-bg:     #FEF5E4;
    --warn-tx:     #8A6000;
    --danger-bg:   #FDECEC;
    --danger-tx:   #9A2020;
    --radius-sm:   6px;
    --radius-md:   10px;
    --radius-lg:   14px;
    --shadow:      0 1px 4px rgba(0,0,0,0.07);
    --shadow-md:   0 4px 16px rgba(0,168,157,0.10);
  }

  /* ===== RESET ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  a { color: var(--brand); text-decoration: none; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    position: fixed; top: 0; left: 0;
    width: 220px; height: 100vh;
    background: var(--brand);
    display: flex; flex-direction: column;
    padding: 0;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  .sidebar-logo span {
    font-size: 13px; font-weight: 700;
    color: #fff; letter-spacing: 0.08em;
    display: block;
  }
  .sidebar-logo small {
    font-size: 11px; color: rgba(255,255,255,0.65);
    font-weight: 400;
  }
  .sidebar-nav { flex: 1; padding: 16px 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 20px;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.75);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; border-left-color: #fff; }
  .nav-icon { width: 16px; height: 16px; flex-shrink: 0; }

  /* ===== MAIN ===== */
  .main {
    margin-left: 220px;
    padding: 28px 32px;
    min-height: 100vh;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* ===== PAGE HEADER ===== */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em;
  }
  .page-title small {
    font-size: 12px; color: var(--text-sub);
    font-weight: 400; margin-left: 8px; letter-spacing: 0;
  }

  /* ===== METRICS ===== */
  .metrics {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-bottom: 24px;
  }
  .metric-card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 20px; box-shadow: var(--shadow);
    border-left: 4px solid var(--brand);
  }
  .metric-label { font-size: 11px; color: var(--text-sub); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
  .metric-value { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }

  /* ===== CARD ===== */
  .card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 24px; box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--text-sub);
    letter-spacing: 0.04em; text-transform: uppercase;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  /* ===== FILTER ROW ===== */
  .filter-row {
    display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
  }
  .filter-row input, .filter-row select {
    font-size: 13px; padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    outline: none;
  }
  .filter-row input { flex: 1; min-width: 180px; }
  .filter-row input:focus, .filter-row select:focus { border-color: var(--brand); }

  /* ===== TABLE ===== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 12px;
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    font-size: 11px; font-weight: 600;
    color: var(--text-sub); letter-spacing: 0.04em; text-transform: uppercase;
    white-space: nowrap;
  }
  td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--brand-light); }

  /* ===== BADGES ===== */
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  }
  .badge-ordered  { background: var(--warn-bg);    color: var(--warn-tx); }
  .badge-delivered{ background: var(--success-bg); color: var(--success-tx); }
  .badge-cancelled{ background: var(--danger-bg);  color: var(--danger-tx); }
  .badge-pending  { background: #F0F0F0;            color: var(--text-sub); }

  .cc-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--brand-light); color: var(--brand-dark);
    font-weight: 500; white-space: nowrap;
  }
  .cc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ===== BUTTONS ===== */
  .btn {
    padding: 8px 18px; font-size: 13px; font-weight: 600;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn-primary {
    background: var(--brand); color: #fff; border-color: var(--brand);
  }
  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { color: var(--danger-tx); border-color: #FBBCBC; }
  .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger-tx); }

  /* ===== FORM ===== */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
  .fg input, .fg select, .fg textarea {
    font-size: 14px; padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    transition: border-color 0.15s; outline: none; width: 100%;
  }
  .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--brand); }
  .fg textarea { resize: vertical; min-height: 64px; }
  .form-actions {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
    padding-top: 20px; border-top: 1px solid var(--border);
  }

  /* ===== IMPORT BOX ===== */
  .import-box {
    background: var(--brand-light);
    border: 1.5px solid var(--brand);
    border-radius: var(--radius-lg);
    padding: 20px; margin-bottom: 20px;
  }
  .import-box-title { font-size: 13px; font-weight: 600; color: var(--brand-dark); margin-bottom: 12px; }
  .import-tabs-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .itab {
    padding: 6px 14px; font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--brand); border-radius: var(--radius-sm);
    background: transparent; color: var(--brand); cursor: pointer;
    transition: all 0.15s;
  }
  .itab.on { background: var(--brand); color: #fff; }
  .url-row { display: flex; gap: 8px; }
  .url-row input {
    flex: 1; font-size: 14px; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none;
  }
  .url-row input:focus { border-color: var(--brand); }
  .paste-hint { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.7; }
  .paste-hint code { background: rgba(0,168,157,0.1); padding: 1px 5px; border-radius: 3px; font-family: monospace; }
  .paste-ta {
    width: 100%; min-height: 90px; resize: vertical;
    font-size: 13px; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none;
  }
  .paste-ta:focus { border-color: var(--brand); }

  .ld-bar { height: 2px; background: rgba(0,168,157,0.2); border-radius: 1px; margin-top: 10px; overflow: hidden; display: none; }
  .ld-inner { height: 100%; background: var(--brand); animation: lda 1.4s ease-in-out infinite; }
  @keyframes lda { 0%{width:0;margin-left:0} 50%{width:50%;margin-left:25%} 100%{width:0;margin-left:100%} }
  .ld-txt { font-size: 12px; color: var(--brand-dark); margin-top: 6px; display: none; }

  .banner { border-radius: var(--radius-sm); padding: 9px 14px; font-size: 13px; margin-top: 10px; display: none; }
  .banner-ok { background: var(--success-bg); color: var(--success-tx); }
  .banner-err { background: var(--danger-bg); color: var(--danger-tx); }

  .fprev { background: var(--surface); border-radius: var(--radius-sm); padding: 12px; margin-top: 10px; display: none; border: 1px solid var(--border); }
  .fp-row { display: flex; gap: 10px; margin-bottom: 5px; font-size: 13px; }
  .fp-row:last-child { margin-bottom: 0; }
  .fp-lbl { min-width: 56px; font-size: 11px; font-weight: 600; color: var(--text-sub); padding-top: 2px; flex-shrink: 0; }
  .fp-val { color: var(--text); font-weight: 500; word-break: break-all; }

  /* ===== CC CARDS ===== */
  .cc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .cc-card {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 20px; box-shadow: var(--shadow); position: relative;
    border-top: 4px solid var(--brand);
  }
  .cc-bar { height: 4px; border-radius: 2px; margin-bottom: 14px; }
  .cc-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .cc-num { font-size: 13px; color: var(--text-sub); font-family: 'Courier New', monospace; letter-spacing: 0.07em; }
  .cc-brand-label { font-size: 11px; color: var(--text-hint); margin-top: 4px; }
  .cc-dates { display: flex; gap: 20px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .cc-date-item { display: flex; flex-direction: column; gap: 3px; }
  .cc-date-item .dl { font-size: 10px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.05em; }
  .cc-date-item .dv { font-size: 14px; font-weight: 700; color: var(--brand-dark); }
  .cc-del { position: absolute; top: 14px; right: 14px; }

  /* ===== EXPORT ===== */
  .exp-pre {
    font-family: 'Courier New', monospace; font-size: 12px; color: var(--text-sub);
    white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    padding: 12px; background: var(--bg); border-radius: var(--radius-sm);
    margin-top: 12px; border: 1px solid var(--border);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--brand); color: #fff;
    padding: 10px 20px; border-radius: var(--radius-md);
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    box-shadow: var(--shadow-md);
  }
  .toast.on { opacity: 1; }

  /* ===== DATE ROW ===== */
  .date-row { display: flex; gap: 6px; }
  .date-row input { flex: 1; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <span>仕入れ管理</span>
    <small>Purchase Management</small>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" onclick="sw('list',this)" data-page="list">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="2" width="14" height="3" rx="1"/><rect x="1" y="7" width="14" height="3" rx="1"/><rect x="1" y="12" width="14" height="2" rx="1"/>
      </svg>
      発注一覧
    </div>
    <div class="nav-item" onclick="sw('add',this)" data-page="add">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="6.5"/><line x1="8" y1="5" x2="8" y2="11"/><line x1="5" y1="8" x2="11" y2="8"/>
      </svg>
      新規登録
    </div>
    <div class="nav-item" onclick="sw('cards',this)" data-page="cards">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="3" width="14" height="10" rx="2"/><line x1="1" y1="7" x2="15" y2="7"/>
      </svg>
      カード管理
    </div>
    <div class="nav-item" onclick="sw('export',this)" data-page="export">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 1v9m0 0L5 7m3 3 3-3M2 12v1a2 2 0 002 2h8a2 2 0 002-2v-1"/>
      </svg>
      エクスポート
    </div>
  </nav>
  <div style="padding:12px 16px 20px;">
    <div onclick="logout()" style="display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.65);cursor:pointer;border-radius:8px;transition:background 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background=''">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H2v12h4M10 11l3-3-3-3M13 8H6"/></svg>
      ログアウト
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- 発注一覧 -->
  <div id="p-list" class="page active">
    <div class="page-header">
      <div class="page-title">発注一覧 <small id="order-count"></small></div>
      <button class="btn btn-primary" onclick="sw('add', document.querySelector('[data-page=add]'))">＋ 新規登録</button>
    </div>
    <div class="metrics" id="mets"></div>
    <div class="card">
      <div class="filter-row">
        <input type="text" id="srch" placeholder="商品名・仕入れ先で検索..." oninput="rt()">
        <select id="fst" onchange="rt()">
          <option value="">すべてのステータス</option>
          <option>未発注</option><option>発注済</option><option>納品済</option><option>キャンセル</option>
        </select>
        <select id="fcl" onchange="rt()"><option value="">すべての納品先</option></select>
        <select id="fca" onchange="rt()"><option value="">すべてのカード</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>発注日</th><th>商品名</th><th>仕入れ先</th>
            <th style="text-align:right">数量</th><th style="text-align:right">単価</th><th style="text-align:right">小計</th>
            <th>納品先</th><th>カード</th><th>状態</th><th>メモ</th><th></th>
          </tr></thead>
          <tbody id="tbd"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 新規登録 -->
  <div id="p-add" class="page">
    <div class="page-header">
      <div class="page-title">新規登録</div>
    </div>

    <div class="import-box">
      <div class="import-box-title">商品情報の自動読み込み</div>
      <div class="import-tabs-row">
        <button class="itab on" onclick="switchImport('url',this)">URLで読み込む</button>
        <button class="itab" onclick="switchImport('paste',this)">テキストを貼り付ける</button>
      </div>
      <div id="im-url">
        <div class="url-row">
          <input type="url" id="pu" placeholder="https://www.e-trend.co.jp/items/...">
          <button class="btn btn-primary" id="load-btn" onclick="loadURL()">読み込む</button>
        </div>
        <div style="font-size:11px;color:var(--text-hint);margin-top:6px">Amazon・楽天・e-trendなど対応。読み込めない場合は「テキストを貼り付ける」をご利用ください。</div>
      </div>
      <div id="im-paste" style="display:none">
        <p class="paste-hint">商品ページを開き、全選択（<code>Ctrl+A</code>）→コピーして下に貼り付けてください。</p>
        <textarea class="paste-ta" id="paste-text" placeholder="商品ページのテキストをここに貼り付け..."></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px">
          <button class="btn btn-primary" id="parse-btn" onclick="parseText()">解析する</button>
        </div>
      </div>
      <div class="ld-bar" id="ldb"><div class="ld-inner"></div></div>
      <div class="ld-txt" id="ldt">AIが解析中...</div>
      <div class="banner banner-ok" id="okb"></div>
      <div class="banner banner-err" id="erb"></div>
      <div class="fprev" id="fprev"></div>
    </div>

    <div class="card">
      <div class="card-title">発注情報</div>
      <div class="form-grid">
        <div class="fg full"><label>商品名 *</label><input type="text" id="fn" placeholder="商品名（型番含む）"></div>
        <div class="fg"><label>仕入れ先</label><input type="text" id="fs" placeholder="Amazon / e-trend など"></div>
        <div class="fg"><label>ブランド / メーカー</label><input type="text" id="fbr" placeholder="Dell / Panasonic など"></div>
        <div class="fg"><label>数量</label><input type="number" id="fq" value="1" min="1"></div>
        <div class="fg"><label>単価（円）</label><input type="number" id="fp" placeholder="0"></div>
        <div class="fg">
          <label>発注日</label>
          <div class="date-row">
            <input type="date" id="fd">
            <button class="btn btn-sm" onclick="today()">今日</button>
          </div>
        </div>
        <div class="fg"><label>納品先（クライアント名）</label><input type="text" id="fcl2" list="cldl" placeholder="クライアント名"><datalist id="cldl"></datalist></div>
        <div class="fg"><label>支払いカード</label><select id="fcd"><option value="">カードを選択</option></select></div>
        <div class="fg"><label>ステータス</label>
          <select id="fss"><option>未発注</option><option selected>発注済</option><option>納品済</option><option>キャンセル</option></select>
        </div>
        <div class="fg"><label>商品URL</label><input type="url" id="fu" placeholder="https://..."></div>
        <div class="fg full"><label>メモ・仕様</label><textarea id="fm" placeholder="型番・色・スペックなど"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="clrF()">クリア</button>
        <button class="btn btn-primary" onclick="addOrd()">登録する</button>
      </div>
    </div>
  </div>

  <!-- カード管理 -->
  <div id="p-cards" class="page">
    <div class="page-header">
      <div class="page-title">カード管理</div>
    </div>
    <div class="card">
      <div class="card-title">カードを追加</div>
      <div class="form-grid">
        <div class="fg"><label>カード会社名 *</label><input type="text" id="ccn" placeholder="三井住友、楽天など"></div>
        <div class="fg"><label>ブランド</label><select id="ccb"><option>Visa</option><option>Mastercard</option><option>JCB</option><option>AmEx</option><option>Diners</option></select></div>
        <div class="fg"><label>カード番号（下4桁）</label><input type="text" id="ccl4" placeholder="1234" maxlength="4"></div>
        <div class="fg"><label>締め日</label><input type="text" id="cccd" placeholder="毎月15日"></div>
        <div class="fg"><label>支払日</label><input type="text" id="ccpd" placeholder="翌月10日"></div>
        <div class="fg" style="justify-content:flex-end;align-self:flex-end">
          <button class="btn btn-primary" onclick="addCC()">追加する</button>
        </div>
      </div>
    </div>
    <div class="cc-grid" id="cc-list"></div>
  </div>

  <!-- エクスポート -->
  <div id="p-export" class="page">
    <div class="page-header">
      <div class="page-title">エクスポート / API連携</div>
    </div>
    <div class="card">
      <div class="card-title">データ出力</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <button class="btn btn-primary" onclick="cpJSON()">JSON コピー</button>
        <button class="btn" onclick="dlCSV()">CSV ダウンロード</button>
        <button class="btn" onclick="showPayload()">プレビュー更新</button>
      </div>
      <div class="exp-pre" id="exp-pre"></div>
    </div>
  </div>

</main>

<div class="toast" id="tst"></div>

<script>
const BCOL = { Visa:'#1A1F71', Mastercard:'#EB001B', JCB:'#003087', AmEx:'#007B5E', Diners:'#004A97' };

let orders = [];
let cards  = [];

const API = 'api.php';
async function apiFetch(action, data) {
  let res;
  if (data) {
    res = await fetch(`${API}?action=${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action, ...data}) });
  } else {
    res = await fetch(`${API}?action=${action}`);
  }
  if (res.status === 401) { location.href = '/login.php'; return; }
  return res.json();
}
async function logout() {
  await apiFetch('logout', {});
  location.href = '/login.php';
}
function save() { /* データはAPIで管理 */ }
function nid(a) { return a.length ? Math.max(...a.map(x => x.id)) + 1 : 1; }
function ccBy(id) { return cards.find(c => c.id === id); }

function sw(page, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('p-' + page).classList.add('active');
  if (page === 'list')   { rmets(); rt(); updFilters(); }
  if (page === 'add')    { today(); updCCSel(); updClSug(); }
  if (page === 'cards')  { renderCC(); }
  if (page === 'export') { showPayload(); }
}

function scls(s) {
  return s==='発注済'?'badge-ordered':s==='納品済'?'badge-delivered':s==='キャンセル'?'badge-cancelled':'badge-pending';
}

function rmets() {
  const tot = orders.length;
  const amt = orders.reduce((s, o) => s + o.qty * o.price, 0);
  const ord = orders.filter(o => o.status === '発注済').length;
  const del = orders.filter(o => o.status === '納品済').length;
  document.getElementById('mets').innerHTML = `
    <div class="metric-card"><div class="metric-label">総件数</div><div class="metric-value">${tot}</div></div>
    <div class="metric-card"><div class="metric-label">合計金額</div><div class="metric-value">¥${amt.toLocaleString()}</div></div>
    <div class="metric-card"><div class="metric-label">発注済</div><div class="metric-value">${ord}</div></div>
    <div class="metric-card"><div class="metric-label">納品済</div><div class="metric-value">${del}</div></div>`;
  document.getElementById('order-count').textContent = `全${tot}件`;
}

function updFilters() {
  const cls = [...new Set(orders.map(o => o.client).filter(Boolean))];
  const fc = document.getElementById('fcl'), cv = fc.value;
  fc.innerHTML = '<option value="">すべての納品先</option>' + cls.map(c => `<option ${c===cv?'selected':''}>${c}</option>`).join('');
  const fca = document.getElementById('fca'), cav = fca.value;
  fca.innerHTML = '<option value="">すべてのカード</option>' + cards.map(c => `<option value="${c.id}" ${c.id==cav?'selected':''}>${c.name}</option>`).join('');
}

function chip(ccId) {
  const c = ccBy(ccId);
  if (!c) return '<span style="color:var(--text-hint)">—</span>';
  const col = BCOL[c.brand] || '#888';
  return `<span class="cc-chip"><span class="cc-dot" style="background:${col}"></span>${c.name}${c.last4 ? ' ···' + c.last4 : ''}</span>`;
}

function rt() {
  const srch = document.getElementById('srch').value.toLowerCase();
  const fs = document.getElementById('fst').value;
  const fc = document.getElementById('fcl').value;
  const fca = document.getElementById('fca').value;
  const data = orders.filter(o => {
    if (fs && o.status !== fs) return false;
    if (fc && o.client !== fc) return false;
    if (fca && o.ccId != fca) return false;
    if (srch && !o.name.toLowerCase().includes(srch) && !(o.shop||'').toLowerCase().includes(srch)) return false;
    return true;
  });
  const tb = document.getElementById('tbd');
  if (!data.length) {
    tb.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--text-hint);padding:32px">データがありません</td></tr>';
    return;
  }
  tb.innerHTML = data.map(o => `<tr>
    <td style="white-space:nowrap;color:var(--text-sub)">${o.date}</td>
    <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.url ? `<a href="${o.url}" target="_blank">${o.name}</a>` : o.name}</td>
    <td style="white-space:nowrap">${o.shop||'—'}</td>
    <td style="text-align:right">${o.qty}</td>
    <td style="text-align:right">¥${o.price.toLocaleString()}</td>
    <td style="text-align:right;font-weight:600">¥${(o.qty*o.price).toLocaleString()}</td>
    <td style="white-space:nowrap">${o.client||'—'}</td>
    <td>${chip(o.ccId)}</td>
    <td><span class="badge ${scls(o.status)}">${o.status}</span></td>
    <td style="color:var(--text-sub);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.memo||''}</td>
    <td><button class="btn btn-sm btn-danger" onclick="delOrd(${o.id})">削除</button></td>
  </tr>`).join('');
}

async function delOrd(id) {
  if (!confirm('削除しますか？')) return;
  await apiFetch('del_order', {id});
  orders = orders.filter(o => o.id !== id);
  rt(); rmets(); toast('削除しました');
}

function today() { const e = document.getElementById('fd'); if (e) e.value = new Date().toISOString().split('T')[0]; }

function updCCSel() {
  const s = document.getElementById('fcd'); if (!s) return;
  s.innerHTML = '<option value="">カードを選択</option>' + cards.map(c => `<option value="${c.id}">${c.name}${c.last4?' ···'+c.last4:''}</option>`).join('');
}

function updClSug() {
  const cl = [...new Set(orders.map(o => o.client).filter(Boolean))];
  const dl = document.getElementById('cldl'); if (dl) dl.innerHTML = cl.map(c => `<option value="${c}">`).join('');
}

function clrF() {
  ['fn','fs','fbr','fu','fm','fcl2'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  document.getElementById('fq').value = 1;
  document.getElementById('fp').value = '';
  document.getElementById('fss').value = '発注済';
  document.getElementById('fcd').value = '';
  document.getElementById('pu').value = '';
  const pt = document.getElementById('paste-text'); if (pt) pt.value = '';
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('ldb').style.display = 'none';
  document.getElementById('ldt').style.display = 'none';
  today();
}

async function addOrd() {
  const name = document.getElementById('fn').value.trim();
  if (!name) { alert('商品名を入力してください'); return; }
  const data = {
    date: document.getElementById('fd').value || new Date().toISOString().split('T')[0],
    name, shop: document.getElementById('fs').value.trim(),
    brand: document.getElementById('fbr').value.trim(),
    url: document.getElementById('fu').value.trim(),
    qty: parseInt(document.getElementById('fq').value) || 1,
    price: parseInt(document.getElementById('fp').value) || 0,
    client: document.getElementById('fcl2').value.trim(),
    ccId: parseInt(document.getElementById('fcd').value) || null,
    status: document.getElementById('fss').value,
    memo: document.getElementById('fm').value.trim()
  };
  const res = await apiFetch('add_order', data);
  orders.push({...data, id: res.id});
  clrF(); toast('登録しました');
  sw('list', document.querySelector('[data-page=list]'));
}

function switchImport(mode, el) {
  document.querySelectorAll('.itab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('im-url').style.display = mode === 'url' ? '' : 'none';
  document.getElementById('im-paste').style.display = mode === 'paste' ? '' : 'none';
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('ldb').style.display = 'none';
  document.getElementById('ldt').style.display = 'none';
}

function showLoading(show) {
  document.getElementById('ldb').style.display = show ? '' : 'none';
  document.getElementById('ldt').style.display = show ? '' : 'none';
}

function guessShop(url) {
  try {
    const h = new URL(url).hostname.replace('www.', '');
    const map = {
      'amazon.co.jp':'Amazon','rakuten.co.jp':'楽天市場',
      'shopping.yahoo.co.jp':'Yahoo!ショッピング','yodobashi.com':'ヨドバシカメラ',
      'kakaku.com':'価格.com','monotaro.com':'MonotaRO','e-trend.co.jp':'イートレンド',
      'edion.co.jp':'エディオン','biccamera.com':'ビックカメラ','joshinweb.jp':'ジョーシン',
      'sofmap.com':'ソフマップ','nojima.co.jp':'ノジマ','askul.co.jp':'ASKUL',
      'yamada-denkiweb.com':'ヤマダ電機'
    };
    for (const [k, v] of Object.entries(map)) { if (h.includes(k)) return v; }
    return h;
  } catch(e) { return ''; }
}

async function callAI(text, url, shopGuess) {
  const prompt = `あなたは通販サイトの商品情報抽出の専門家です。以下のテキストから商品情報を正確に抽出してJSONのみで返してください。

抽出フィールド（不明は空文字か0）:
{
  "name": "商品の正式名称（型番・モデル名を含む完全な名称）",
  "shop": "販売ショップ名",
  "brand": "ブランド・メーカー名",
  "price": 税込価格の数値（不明は0）,
  "model": "型番・品番",
  "color": "カラー・色",
  "spec": "主要スペック概要",
  "memo": "その他の重要仕様・特記事項"
}

ショップ候補: ${shopGuess || '不明'}
URL: ${url || '不明'}

テキスト:
${text.slice(0, 8000)}

JSONのみ。マークダウン不要。`;

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 700,
      messages: [{ role: 'user', content: prompt }] })
  });
  const d = await r.json();
  const txt = d.content.filter(c => c.type === 'text').map(c => c.text).join('');
  const m = txt.replace(/```json|```/g, '').trim().match(/\{[\s\S]*\}/);
  if (!m) throw new Error('parse failed');
  return JSON.parse(m[0]);
}

function applyParsed(parsed, url, shopGuess, source) {
  if (parsed.name)  document.getElementById('fn').value = parsed.name;
  if (parsed.shop)  document.getElementById('fs').value = parsed.shop;
  else if (shopGuess) document.getElementById('fs').value = shopGuess;
  if (parsed.brand) document.getElementById('fbr').value = parsed.brand;
  if (parsed.price && parsed.price > 0) document.getElementById('fp').value = parsed.price;
  if (url) document.getElementById('fu').value = url;
  const mp = [];
  if (parsed.model) mp.push('型番：' + parsed.model);
  if (parsed.color) mp.push('色：' + parsed.color);
  if (parsed.spec)  mp.push(parsed.spec);
  if (parsed.memo)  mp.push(parsed.memo);
  if (mp.length) document.getElementById('fm').value = mp.join(' / ');

  const rows = [];
  if (parsed.name) rows.push(['商品名', parsed.name]);
  if (parsed.shop || shopGuess) rows.push(['ショップ', parsed.shop || shopGuess]);
  if (parsed.brand) rows.push(['ブランド', parsed.brand]);
  if (parsed.price && parsed.price > 0) rows.push(['単価', '¥' + Number(parsed.price).toLocaleString()]);
  if (parsed.model) rows.push(['型番', parsed.model]);
  if (parsed.spec)  rows.push(['スペック', parsed.spec]);
  const fprev = document.getElementById('fprev');
  fprev.innerHTML = rows.map(([l, v]) => `<div class="fp-row"><span class="fp-lbl">${l}</span><span class="fp-val">${v}</span></div>`).join('');
  fprev.style.display = '';
  const okb = document.getElementById('okb');
  okb.textContent = source + 'から情報を取得しました。内容を確認して登録してください。';
  okb.style.display = '';
}

async function loadURL() {
  const url = document.getElementById('pu').value.trim();
  if (!url) { alert('URLを入力してください'); return; }
  const btn = document.getElementById('load-btn');
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  showLoading(true); btn.disabled = true; btn.textContent = '取得中...';
  const shopGuess = guessShop(url);
  try {
    const pr = await Promise.race([
      fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`),
      new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 8000))
    ]);
    if (!pr.ok) throw new Error('fetch failed');
    const pd = await pr.json();
    if (!pd.contents || pd.contents.length < 100) throw new Error('empty');
    const tmp = document.createElement('div');
    tmp.innerHTML = pd.contents;
    ['script','style','nav','footer','header','noscript','aside'].forEach(t => tmp.querySelectorAll(t).forEach(e => e.remove()));
    const pageText = (tmp.innerText || tmp.textContent || '').replace(/\s+/g, ' ').trim();
    const parsed = await callAI(pageText, url, shopGuess);
    if (!parsed.name && !parsed.shop) throw new Error('no data');
    applyParsed(parsed, url, shopGuess, 'ページ');
  } catch(e) {
    try {
      const parsed = await callAI('URLのみからできる限り推測してください。', url, shopGuess);
      if (parsed.name || parsed.shop) {
        applyParsed(parsed, url, shopGuess, 'URL');
        document.getElementById('okb').textContent += ' ※ページ取得不可のためURLから推測。単価など要確認。';
      } else { throw new Error('no data'); }
    } catch(e2) {
      if (shopGuess) document.getElementById('fs').value = shopGuess;
      document.getElementById('fu').value = url;
      const erb = document.getElementById('erb');
      erb.textContent = 'ページを取得できませんでした。「テキストを貼り付ける」タブをお試しください。';
      erb.style.display = '';
    }
  } finally {
    showLoading(false); btn.disabled = false; btn.textContent = '読み込む';
  }
}

async function parseText() {
  const text = document.getElementById('paste-text').value.trim();
  if (!text || text.length < 20) { alert('テキストを貼り付けてください'); return; }
  const btn = document.getElementById('parse-btn');
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  showLoading(true); btn.disabled = true; btn.textContent = '解析中...';
  try {
    const parsed = await callAI(text, '', '');
    if (parsed.name || parsed.shop) { applyParsed(parsed, '', '', 'テキスト'); }
    else { throw new Error('no data'); }
  } catch(e) {
    document.getElementById('erb').textContent = '解析できませんでした。商品名・価格が含まれるテキストを貼り付けてください。';
    document.getElementById('erb').style.display = '';
  } finally {
    showLoading(false); btn.disabled = false; btn.textContent = '解析する';
  }
}

function renderCC() {
  const el = document.getElementById('cc-list');
  if (!cards.length) { el.innerHTML = '<p style="color:var(--text-hint);font-size:13px">登録されたカードはありません</p>'; return; }
  el.innerHTML = cards.map(c => {
    const col = BCOL[c.brand] || '#888';
    return `<div class="cc-card">
      <div class="cc-bar" style="background:${col}"></div>
      <div class="cc-name">${c.name}</div>
      ${c.last4 ? `<div class="cc-num">···· ···· ···· ${c.last4}</div>` : ''}
      <div class="cc-brand-label">${c.brand}</div>
      <div class="cc-dates">
        <div class="cc-date-item"><span class="dl">締め日</span><span class="dv">${c.closing||'—'}</span></div>
        <div class="cc-date-item"><span class="dl">支払日</span><span class="dv">${c.payment||'—'}</span></div>
      </div>
      <div class="cc-del"><button class="btn btn-sm btn-danger" onclick="delCC(${c.id})">削除</button></div>
    </div>`;
  }).join('');
}

async function addCC() {
  const name = document.getElementById('ccn').value.trim();
  if (!name) { alert('カード会社名を入力してください'); return; }
  const data = { name, brand: document.getElementById('ccb').value,
    last4: document.getElementById('ccl4').value.trim(),
    closing: document.getElementById('cccd').value.trim(),
    payment: document.getElementById('ccpd').value.trim() };
  const res = await apiFetch('add_card', data);
  cards.push({...data, id: res.id});
  ['ccn','ccl4','cccd','ccpd'].forEach(id => document.getElementById(id).value = '');
  renderCC(); toast('カードを追加しました');
}

async function delCC(id) {
  if (orders.some(o => o.ccId === id)) { if (!confirm('このカードを使用した発注があります。削除しますか？')) return; }
  else if (!confirm('削除しますか？')) return;
  await apiFetch('del_card', {id});
  cards = cards.filter(c => c.id !== id);
  renderCC(); toast('削除しました');
}

function showPayload() {
  const pl = { version:'1.0', exported_at: new Date().toISOString(), cards,
    records: orders.map(o => ({ ...o, subtotal: o.qty * o.price, card: ccBy(o.ccId) || null })) };
  document.getElementById('exp-pre').textContent = JSON.stringify(pl, null, 2);
}

function cpJSON() {
  const pl = { version:'1.0', exported_at: new Date().toISOString(), cards,
    records: orders.map(o => ({ ...o, subtotal: o.qty * o.price, card: ccBy(o.ccId) || null })) };
  navigator.clipboard.writeText(JSON.stringify(pl, null, 2)).then(() => toast('JSONをコピーしました'));
}

function dlCSV() {
  const h = 'id,発注日,商品名,仕入れ先,ブランド,数量,単価,小計,納品先,カード,ステータス,メモ';
  const rows = orders.map(o => {
    const c = ccBy(o.ccId);
    return [o.id, o.date, `"${o.name}"`, `"${o.shop||''}"`, `"${o.brand||''}"`, o.qty, o.price,
      o.qty*o.price, `"${o.client||''}"`, c ? `"${c.name}"` : '', o.status, `"${o.memo||''}"`].join(',');
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + [h,...rows].join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `仕入れ管理_${new Date().toISOString().split('T')[0]}.csv`;
  a.click(); toast('CSVをダウンロードしました');
}

function toast(msg) {
  const t = document.getElementById('tst');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2500);
}

// Init
(async () => {
  [orders, cards] = await Promise.all([apiFetch('orders'), apiFetch('cards')]);
  rmets(); rt(); updFilters(); today();
})();
</script>
</body>
