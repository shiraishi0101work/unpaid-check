<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>イワタアシスト【ウェブ仕入れ管理】</title>
<style>
  :root {
    --brand:       #00A89D;
    --brand-dark:  #007F77;
    --brand-light: #E0F5F4;
    --bg:          #F2F5F5;
    --surface:     #FFFFFF;
    --border:      #DDE8E7;
    --text:        #1A2A29;
    --text-sub:    #5A7170;
    --text-hint:   #9AB5B3;
    --success-bg:  #E6F7F0;
    --success-tx:  #1A7A50;
    --warn-bg:     #FEF5E4;
    --warn-tx:     #8A6000;
    --danger-bg:   #FDECEC;
    --danger-tx:   #9A2020;
    --nav-h:       56px;
    --radius-sm:   8px;
    --radius-md:   12px;
    --radius-lg:   16px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overscroll-behavior: none;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 52px; background: var(--brand);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    z-index: 200;
  }
  .topbar-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
  .topbar-sub { font-size: 11px; color: rgba(255,255,255,0.7); }

  /* ===== BOTTOM NAV ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--nav-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; z-index: 200;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bnav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; cursor: pointer;
    color: var(--text-hint); font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em; transition: color 0.15s;
    -webkit-tap-highlight-color: transparent;
    padding: 6px 0;
  }
  .bnav-item svg { width: 20px; height: 20px; }
  .bnav-item.active { color: var(--brand); }
  .bnav-item.active svg { stroke: var(--brand); }

  /* ===== SCROLL AREA ===== */
  .scroll-area {
    position: fixed; top: 52px; left: 0; right: 0;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 14px 24px;
  }

  /* ===== PAGE ===== */
  .page { display: none; }
  .page.active { display: block; }

  /* ===== METRICS ===== */
  .mets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .met {
    background: var(--surface); border-radius: var(--radius-md);
    padding: 14px; border-left: 3px solid var(--brand);
  }
  .met .l { font-size: 10px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; }
  .met .v { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; margin-top: 2px; }

  /* ===== CARD ===== */
  .card {
    background: var(--surface); border-radius: var(--radius-md);
    padding: 14px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px; font-weight: 700; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ===== ORDER LIST ===== */
  .order-item {
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .order-item:last-child { border-bottom: none; }
  .order-row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .order-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.4; }
  .order-price { font-size: 14px; font-weight: 700; color: var(--brand-dark); white-space: nowrap; }
  .order-row2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .order-meta { font-size: 11px; color: var(--text-sub); }
  .order-actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; justify-content: flex-end; }

  /* ===== BADGES ===== */
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge-ordered   { background: var(--warn-bg);    color: var(--warn-tx); }
  .badge-delivered { background: var(--success-bg); color: var(--success-tx); }
  .badge-cancelled { background: var(--danger-bg);  color: var(--danger-tx); }
  .badge-pending   { background: #F0F0F0;            color: var(--text-sub); }

  .cc-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: var(--brand-light); color: var(--brand-dark); font-weight: 600;
  }
  .cc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ===== FILTER ===== */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .filter-row input, .filter-row select {
    font-size: 13px; padding: 8px 10px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none;
  }
  .filter-row input { flex: 1; }

  /* ===== IMPORT ===== */
  .import-box {
    background: var(--brand-light); border: 1.5px solid var(--brand);
    border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px;
  }
  .import-box-title { font-size: 12px; font-weight: 700; color: var(--brand-dark); margin-bottom: 10px; }
  .itabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .itab {
    flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--brand); border-radius: var(--radius-sm);
    background: transparent; color: var(--brand); cursor: pointer; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .itab.on { background: var(--brand); color: #fff; }
  .url-row { display: flex; gap: 8px; }
  .url-row input {
    flex: 1; font-size: 14px; padding: 10px 11px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none;
  }
  .paste-hint { font-size: 11px; color: var(--text-sub); line-height: 1.7; margin-bottom: 8px; }
  .paste-hint code { background: rgba(0,168,157,0.12); padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 11px; }
  .paste-ta {
    width: 100%; min-height: 80px; resize: vertical;
    font-size: 13px; padding: 10px 11px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none;
  }

  .ld-bar { height: 2px; background: rgba(0,168,157,0.2); border-radius: 1px; margin-top: 8px; overflow: hidden; display: none; }
  .ld-inner { height: 100%; background: var(--brand); animation: lda 1.4s ease-in-out infinite; }
  @keyframes lda { 0%{width:0;margin-left:0} 50%{width:50%;margin-left:25%} 100%{width:0;margin-left:100%} }
  .ld-txt { font-size: 12px; color: var(--brand-dark); margin-top: 6px; display: none; }

  .banner { border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; margin-top: 8px; display: none; }
  .banner-ok { background: var(--success-bg); color: var(--success-tx); }
  .banner-err { background: var(--danger-bg); color: var(--danger-tx); }
  .fprev { background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; display: none; border: 1px solid var(--border); }
  .fp-row { display: flex; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .fp-row:last-child { margin-bottom: 0; }
  .fp-lbl { min-width: 50px; color: var(--text-sub); flex-shrink: 0; font-weight: 600; font-size: 11px; padding-top: 1px; }
  .fp-val { color: var(--text); font-weight: 500; word-break: break-all; }

  /* ===== FORM ===== */
  .fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .fg label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
  .fg input, .fg select, .fg textarea {
    font-size: 16px; /* prevents zoom on iOS */
    padding: 11px 12px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    outline: none; width: 100%;
    -webkit-appearance: none;
  }
  .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--brand); }
  .fg textarea { resize: vertical; min-height: 72px; font-size: 14px; }
  .date-row { display: flex; gap: 8px; }
  .date-row input { flex: 1; }

  /* ===== BUTTONS ===== */
  .btn {
    padding: 10px 18px; font-size: 13px; font-weight: 700;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-full { width: 100%; text-align: center; padding: 13px; font-size: 15px; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-danger { color: var(--danger-tx); border-color: #FBBCBC; }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .form-actions .btn { flex: 1; text-align: center; }

  /* ===== CC CARDS ===== */
  .cc-card {
    background: var(--surface); border-radius: var(--radius-md);
    padding: 16px; margin-bottom: 10px; position: relative;
    border-top: 4px solid var(--brand);
  }
  .cc-bar { height: 4px; border-radius: 2px; margin-bottom: 12px; }
  .cc-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .cc-num { font-size: 13px; color: var(--text-sub); font-family: 'Courier New', monospace; letter-spacing: 0.06em; }
  .cc-brand-label { font-size: 11px; color: var(--text-hint); margin-top: 3px; }
  .cc-dates { display: flex; gap: 20px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .cc-date-item { display: flex; flex-direction: column; gap: 3px; }
  .cc-date-item .dl { font-size: 10px; font-weight: 700; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.05em; }
  .cc-date-item .dv { font-size: 15px; font-weight: 700; color: var(--brand-dark); }
  .cc-del { position: absolute; top: 14px; right: 14px; }

  /* ===== EXPORT ===== */
  .exp-pre {
    font-family: 'Courier New', monospace; font-size: 11px; color: var(--text-sub);
    white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    padding: 10px; background: var(--bg); border-radius: var(--radius-sm);
    margin-top: 10px; border: 1px solid var(--border);
  }
  .exp-btns { display: flex; flex-direction: column; gap: 8px; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--brand); color: #fff;
    padding: 10px 22px; border-radius: var(--radius-md);
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,168,157,0.3);
  }
  .toast.on { opacity: 1; }

  .section-gap { height: 8px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div>
    <div class="topbar-title">イワタアシスト【ウェブ仕入れ管理】</div>
  </div>
  <div class="topbar-sub" id="top-count"></div>
</header>

<!-- SCROLL AREA -->
<div class="scroll-area" id="scroll-area">

  <!-- 発注一覧 -->
  <div id="p-list" class="page active">
    <div class="mets" id="mets"></div>
    <div class="card">
      <div class="filter-row">
        <input type="text" id="srch" placeholder="検索..." oninput="rt()">
        <select id="fst" onchange="rt()">
          <option value="">すべて</option>
          <option>未発注</option><option>発注済</option><option>納品済</option><option>キャンセル</option>
        </select>
      </div>
      <div id="order-list"></div>
    </div>
  </div>

  <!-- 納品先一覧 -->
  <div id="p-clients" class="page">
    <div class="card">
      <div class="card-title">納品先を追加</div>
      <div class="fg"><label>納品先名 *</label><input type="text" id="cl-name" placeholder="クライアント名"></div>
      <button class="btn btn-primary btn-full" onclick="addClient()" style="margin-top:8px">追加する</button>
    </div>
    <div class="card">
      <div class="card-title">登録済み納品先</div>
      <div id="clients-list"><p style="text-align:center;color:var(--text-hint);padding:24px;font-size:13px">納品先が登録されていません</p></div>
    </div>
  </div>

  <!-- 仕入れ登録 -->
  <div id="p-add" class="page">
    <div class="import-box">
      <div class="import-box-title">商品情報の自動読み込み</div>
      <div class="itabs">
        <button class="itab on" onclick="switchImport('url',this)">URLで読み込む</button>
        <button class="itab" onclick="switchImport('paste',this)">テキストを貼り付ける</button>
      </div>
      <div id="im-url">
        <div class="url-row">
          <input type="url" id="pu" placeholder="https://..." inputmode="url" autocomplete="off">
          <button class="btn btn-primary btn-sm" id="load-btn" onclick="loadURL()">読み込む</button>
        </div>
        <div style="font-size:11px;color:var(--text-hint);margin-top:5px">読み込めない場合は「テキストを貼り付ける」をお試しください。</div>
      </div>
      <div id="im-paste" style="display:none">
        <p class="paste-hint">商品ページを開き、全選択（<code>長押し→全選択</code>）→コピーして貼り付けてください。</p>
        <textarea class="paste-ta" id="paste-text" placeholder="ここに貼り付け..."></textarea>
        <div style="margin-top:8px">
          <button class="btn btn-primary btn-full" id="parse-btn" onclick="parseText()">解析する</button>
        </div>
      </div>
      <div class="ld-bar" id="ldb"><div class="ld-inner"></div></div>
      <div class="ld-txt" id="ldt">AIが解析中...</div>
      <div class="banner banner-ok" id="okb"></div>
      <div class="banner banner-err" id="erb"></div>
      <div class="fprev" id="fprev"></div>
    </div>

    <div class="card">
      <div class="card-title">発注情報</div>
      <div class="fg"><label>商品名 *</label><input type="text" id="fn" placeholder="商品名（型番含む）" autocomplete="off"></div>
      <div class="fg"><label>仕入れ先</label><input type="text" id="fs" placeholder="Amazon / e-trend など" autocomplete="off"></div>
      <div class="fg"><label>ブランド / メーカー</label><input type="text" id="fbr" placeholder="Dell / Panasonic など" autocomplete="off"></div>
      <div class="fg"><label>数量</label><input type="number" id="fq" value="1" min="1" inputmode="numeric"></div>
      <div class="fg"><label>単価（円）</label><input type="number" id="fp" placeholder="0" inputmode="numeric"></div>
      <div class="fg">
        <label>発注日</label>
        <div class="date-row">
          <input type="date" id="fd">
          <button class="btn btn-sm" onclick="today()" style="white-space:nowrap">今日</button>
        </div>
      </div>
      <div class="fg"><label>納品先（クライアント名）</label><input type="text" id="fcl2" list="cldl" placeholder="クライアント名"><datalist id="cldl"></datalist></div>
      <div class="fg"><label>支払いカード</label><select id="fcd"><option value="">カードを選択</option></select></div>
      <div class="fg"><label>ステータス</label>
        <select id="fss"><option>未発注</option><option selected>発注済</option><option>納品済</option><option>キャンセル</option></select>
      </div>
      <div class="fg"><label>商品URL</label><input type="url" id="fu" placeholder="https://" inputmode="url"></div>
      <div class="fg"><label>メモ・仕様</label><textarea id="fm" placeholder="型番・色・スペックなど"></textarea></div>
      <div class="form-actions">
        <button class="btn" onclick="clrF()">クリア</button>
        <button class="btn btn-primary" onclick="addOrd()">登録する</button>
      </div>
    </div>
  </div>

  <!-- カード管理 -->
  <div id="p-cards" class="page">
    <div class="card">
      <div class="card-title">カードを追加</div>
      <div class="fg"><label>カード会社名 *</label><input type="text" id="ccn" placeholder="三井住友、楽天など"></div>
      <div class="fg"><label>ブランド</label><select id="ccb"><option>Visa</option><option>Mastercard</option><option>JCB</option><option>AmEx</option><option>Diners</option></select></div>
      <div class="fg"><label>カード番号（下4桁）</label><input type="text" id="ccl4" placeholder="1234" maxlength="4" inputmode="numeric"></div>
      <div class="fg"><label>締め日</label><input type="text" id="cccd" placeholder="毎月15日"></div>
      <div class="fg"><label>支払日</label><input type="text" id="ccpd" placeholder="翌月10日"></div>
      <button class="btn btn-primary btn-full" onclick="addCC()">追加する</button>
    </div>
    <div id="cc-list"></div>
  </div>

  <!-- エクスポート -->
  <div id="p-export" class="page">
    <div class="card">
      <div class="card-title">エクスポート / API連携</div>
      <div class="exp-btns">
        <button class="btn btn-primary btn-full" onclick="cpJSON()">JSON コピー</button>
        <button class="btn btn-full" onclick="dlCSV()">CSV ダウンロード</button>
        <button class="btn btn-full" onclick="showPayload()">プレビュー更新</button>
      </div>
      <div class="exp-pre" id="exp-pre"></div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="bnav-item active" onclick="swNav('list',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="18" height="4" rx="1.5"/>
    </svg>
    一覧
  </div>
  <div class="bnav-item" onclick="swNav('add',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    仕入れ登録
  </div>
  <div class="bnav-item" onclick="swNav('clients',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="8" cy="7" r="3"/><circle cx="16" cy="7" r="3"/>
      <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14 17c.8-.8 2-1.4 2-2 2.8 0 5 2.2 5 5"/>
    </svg>
    納品先
  </div>
  <div class="bnav-item" onclick="swNav('cards',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/>
    </svg>
    カード
  </div>
  <div class="bnav-item" onclick="swNav('export',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 3v12m0 0l-4-4m4 4 4-4M3 17v1a3 3 0 003 3h12a3 3 0 003-3v-1"/>
    </svg>
    出力
  </div>
  <div class="bnav-item" onclick="openPwModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="7" r="4"/><path d="M4 21c0-5 3.6-9 8-9s8 4 8 9"/>
    </svg>
    設定
  </div>
  <div class="bnav-item" onclick="logout()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M9 3H5v18h4M15 17l5-5-5-5M20 12H9"/>
    </svg>
    ログアウト
  </div>
</nav>

<!-- パスワード変更モーダル -->
<div id="pw-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.15);">
    <div style="font-size:16px;font-weight:700;color:#1A2A29;margin-bottom:20px;">パスワード変更</div>
    <label style="display:block;font-size:12px;font-weight:600;color:#5A7170;margin-bottom:6px;">現在のパスワード</label>
    <div style="position:relative;margin-bottom:14px;">
      <input id="pw-cur" type="password" style="width:100%;padding:10px 40px 10px 12px;border:1px solid #D8E4E3;border-radius:8px;font-size:14px;">
      <button type="button" onclick="togglePw('pw-cur',this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#9AB5B3;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <label style="display:block;font-size:12px;font-weight:600;color:#5A7170;margin-bottom:6px;">新しいパスワード</label>
    <div style="position:relative;margin-bottom:6px;">
      <input id="pw-new" type="password" style="width:100%;padding:10px 40px 10px 12px;border:1px solid #D8E4E3;border-radius:8px;font-size:14px;">
      <button type="button" onclick="togglePw('pw-new',this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#9AB5B3;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div id="pw-err" style="color:#9A2020;font-size:12px;min-height:18px;margin-bottom:14px;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="closePwModal()" style="flex:1;padding:10px;border:1px solid #D8E4E3;background:#fff;border-radius:8px;font-size:14px;cursor:pointer;">キャンセル</button>
      <button onclick="submitPw()" style="flex:1;padding:10px;background:#00A89D;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">変更する</button>
    </div>
  </div>
</div>

<div class="toast" id="tst"></div>

<script>
const BCOL = { Visa:'#1A1F71', Mastercard:'#EB001B', JCB:'#003087', AmEx:'#007B5E', Diners:'#004A97' };

let orders = [];
let cards  = [];

const API = 'api.php';
async function apiFetch(action, data) {
  let res;
  if (data) {
    res = await fetch(`${API}?action=${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action, ...data}) });
  } else {
    res = await fetch(`${API}?action=${action}`);
  }
  if (res.status === 401) { location.href = '/login.php'; return; }
  return res.json();
}
async function logout() {
  await apiFetch('logout', {});
  location.href = '/login.php';
}
function openPwModal() {
  document.getElementById('pw-cur').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-err').textContent = '';
  const m = document.getElementById('pw-modal');
  m.style.display = 'flex';
}
function closePwModal() {
  document.getElementById('pw-modal').style.display = 'none';
}
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = show
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
}
async function submitPw() {
  const cur = document.getElementById('pw-cur').value;
  const nw  = document.getElementById('pw-new').value;
  const err = document.getElementById('pw-err');
  err.textContent = '';
  const r = await apiFetch('change_password', { current: cur, new: nw });
  if (r?.ok) {
    closePwModal();
    alert('パスワードを変更しました');
  } else {
    err.textContent = r?.error || 'エラーが発生しました';
  }
}
function save() { /* データはAPIで管理 */ }
function nid(a) { return a.length ? Math.max(...a.map(x => x.id)) + 1 : 1; }
function ccBy(id) { return cards.find(c => c.id === id); }

function swNav(page, el) {
  document.querySelectorAll('.bnav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('p-' + page).classList.add('active');
  document.getElementById('scroll-area').scrollTop = 0;
  if (page === 'list')   { rmets(); rt(); }
  if (page === 'add')    { today(); updCCSel(); updClSug(); }
  if (page === 'cards')  { renderCC(); }
  if (page === 'export') { showPayload(); }
}

function scls(s) {
  return s==='発注済'?'badge-ordered':s==='納品済'?'badge-delivered':s==='キャンセル'?'badge-cancelled':'badge-pending';
}

function rmets() {
  const tot = orders.length;
  const amt = orders.reduce((s, o) => s + o.qty * o.price, 0);
  const ord = orders.filter(o => o.status === '発注済').length;
  const del = orders.filter(o => o.status === '納品済').length;
  document.getElementById('mets').innerHTML = `
    <div class="met"><div class="l">総件数</div><div class="v">${tot}</div></div>
    <div class="met"><div class="l">合計金額</div><div class="v">¥${amt.toLocaleString()}</div></div>
    <div class="met"><div class="l">発注済</div><div class="v">${ord}</div></div>
    <div class="met"><div class="l">納品済</div><div class="v">${del}</div></div>`;
  document.getElementById('top-count').textContent = `${tot}件`;
}

function chip(ccId) {
  const c = ccBy(ccId);
  if (!c) return '';
  return `<span class="cc-chip"><span class="cc-dot" style="background:${BCOL[c.brand]||'#888'}"></span>${c.name}${c.last4?' ···'+c.last4:''}</span>`;
}

function rt() {
  const srch = document.getElementById('srch').value.toLowerCase();
  const fs   = document.getElementById('fst').value;
  const data = orders.filter(o => {
    if (fs && o.status !== fs) return false;
    if (srch && !o.name.toLowerCase().includes(srch) && !(o.shop||'').toLowerCase().includes(srch)) return false;
    return true;
  });
  const el = document.getElementById('order-list');
  if (!data.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--text-hint);padding:24px;font-size:13px">データがありません</div>';
    return;
  }
  el.innerHTML = data.map(o => `
    <div class="order-item">
      <div class="order-row1">
        <div class="order-name">${o.name}</div>
        <div class="order-price">¥${(o.qty*o.price).toLocaleString()}</div>
      </div>
      <div class="order-row2">
        <span class="badge ${scls(o.status)}">${o.status}</span>
        <span class="order-meta">${o.date}</span>
        ${o.shop ? `<span class="order-meta">${o.shop}</span>` : ''}
        ${o.client ? `<span class="order-meta">→ ${o.client}</span>` : ''}
      </div>
      ${chip(o.ccId) ? `<div style="margin-top:6px">${chip(o.ccId)}</div>` : ''}
      ${o.memo ? `<div style="font-size:11px;color:var(--text-sub);margin-top:4px">${o.memo}</div>` : ''}
      <div class="order-actions">
        <button class="btn btn-sm btn-danger" onclick="delOrd(${o.id})">削除</button>
      </div>
    </div>`).join('');
}

async function delOrd(id) {
  if (!confirm('削除しますか？')) return;
  await apiFetch('del_order', {id});
  orders = orders.filter(o => o.id !== id);
  rt(); rmets(); toast('削除しました');
}

function today() { const e = document.getElementById('fd'); if (e) e.value = new Date().toISOString().split('T')[0]; }

function updCCSel() {
  const s = document.getElementById('fcd'); if (!s) return;
  s.innerHTML = '<option value="">カードを選択</option>' + cards.map(c => `<option value="${c.id}">${c.name}${c.last4?' ···'+c.last4:''}</option>`).join('');
}
function updClSug() {
  const cl = [...new Set(orders.map(o => o.client).filter(Boolean))];
  const dl = document.getElementById('cldl'); if (dl) dl.innerHTML = cl.map(c => `<option value="${c}">`).join('');
}

function clrF() {
  ['fn','fs','fbr','fu','fm','fcl2'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  document.getElementById('fq').value = 1;
  document.getElementById('fp').value = '';
  document.getElementById('fss').value = '発注済';
  document.getElementById('fcd').value = '';
  document.getElementById('pu').value = '';
  const pt = document.getElementById('paste-text'); if (pt) pt.value = '';
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('ldb').style.display = 'none';
  document.getElementById('ldt').style.display = 'none';
  today();
}

async function addOrd() {
  const name = document.getElementById('fn').value.trim();
  if (!name) { alert('商品名を入力してください'); return; }
  const data = {
    date: document.getElementById('fd').value || new Date().toISOString().split('T')[0],
    name, shop: document.getElementById('fs').value.trim(),
    brand: document.getElementById('fbr').value.trim(),
    url: document.getElementById('fu').value.trim(),
    qty: parseInt(document.getElementById('fq').value) || 1,
    price: parseInt(document.getElementById('fp').value) || 0,
    client: document.getElementById('fcl2').value.trim(),
    ccId: parseInt(document.getElementById('fcd').value) || null,
    status: document.getElementById('fss').value,
    memo: document.getElementById('fm').value.trim()
  };
  const res = await apiFetch('add_order', data);
  orders.push({...data, id: res.id});
  clrF(); toast('登録しました');
  swNav('list', document.querySelectorAll('.bnav-item')[0]);
}

function switchImport(mode, el) {
  document.querySelectorAll('.itab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('im-url').style.display = mode === 'url' ? '' : 'none';
  document.getElementById('im-paste').style.display = mode === 'paste' ? '' : 'none';
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('ldb').style.display = 'none';
  document.getElementById('ldt').style.display = 'none';
}

function showLoading(show) {
  document.getElementById('ldb').style.display = show ? '' : 'none';
  document.getElementById('ldt').style.display = show ? '' : 'none';
}

function guessShop(url) {
  try {
    const h = new URL(url).hostname.replace('www.', '');
    const map = {
      'amazon.co.jp':'Amazon','rakuten.co.jp':'楽天市場',
      'shopping.yahoo.co.jp':'Yahoo!ショッピング','yodobashi.com':'ヨドバシカメラ',
      'kakaku.com':'価格.com','monotaro.com':'MonotaRO','e-trend.co.jp':'イートレンド',
      'edion.co.jp':'エディオン','biccamera.com':'ビックカメラ','joshinweb.jp':'ジョーシン',
      'sofmap.com':'ソフマップ','nojima.co.jp':'ノジマ','askul.co.jp':'ASKUL',
      'yamada-denkiweb.com':'ヤマダ電機'
    };
    for (const [k, v] of Object.entries(map)) { if (h.includes(k)) return v; }
    return h;
  } catch(e) { return ''; }
}

function getApiKey() { return localStorage.getItem('sf_apikey') || ''; }
function apiHeaders() {
  const k = getApiKey();
  if (!k) { alert('APIキーが未設定です。\nDella ScoreのAPIキー設定から登録してください。'); return null; }
  return { 'Content-Type': 'application/json', 'x-api-key': k, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
}

async function callAI(text, url, shopGuess) {
  const headers = apiHeaders();
  if (!headers) throw new Error('no api key');
  const prompt = `あなたは通販サイトの商品情報抽出の専門家です。以下のテキストから商品情報を正確に抽出してJSONのみで返してください。

抽出フィールド（不明は空文字か0）:
{
  "name": "商品の正式名称（型番・モデル名を含む完全な名称）",
  "shop": "販売ショップ名",
  "brand": "ブランド・メーカー名",
  "price": 税込価格の数値（不明は0）,
  "model": "型番・品番",
  "color": "カラー・色",
  "spec": "主要スペック概要",
  "memo": "その他の重要仕様・特記事項"
}

ショップ候補: ${shopGuess || '不明'}
URL: ${url || '不明'}

テキスト:
${text.slice(0, 8000)}

JSONのみ。マークダウン不要。`;

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers,
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 800,
      messages: [{ role: 'user', content: prompt }] })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || 'api error');
  const txt = d.content.filter(c => c.type === 'text').map(c => c.text).join('');
  const m = txt.replace(/```json|```/g, '').trim().match(/\{[\s\S]*\}/);
  if (!m) throw new Error('parse failed');
  return JSON.parse(m[0]);
}

function applyParsed(parsed, url, shopGuess, source) {
  if (parsed.name)  document.getElementById('fn').value = parsed.name;
  if (parsed.shop)  document.getElementById('fs').value = parsed.shop;
  else if (shopGuess) document.getElementById('fs').value = shopGuess;
  if (parsed.brand) document.getElementById('fbr').value = parsed.brand;
  if (parsed.price && parsed.price > 0) document.getElementById('fp').value = parsed.price;
  if (url) document.getElementById('fu').value = url;
  const mp = [];
  if (parsed.model) mp.push('型番：' + parsed.model);
  if (parsed.color) mp.push('色：' + parsed.color);
  if (parsed.spec)  mp.push(parsed.spec);
  if (parsed.memo)  mp.push(parsed.memo);
  if (mp.length) document.getElementById('fm').value = mp.join(' / ');
  const rows = [];
  if (parsed.name) rows.push(['商品名', parsed.name]);
  if (parsed.shop || shopGuess) rows.push(['ショップ', parsed.shop || shopGuess]);
  if (parsed.brand) rows.push(['ブランド', parsed.brand]);
  if (parsed.price && parsed.price > 0) rows.push(['単価', '¥' + Number(parsed.price).toLocaleString()]);
  if (parsed.model) rows.push(['型番', parsed.model]);
  if (parsed.spec)  rows.push(['スペック', parsed.spec]);
  const fprev = document.getElementById('fprev');
  fprev.innerHTML = rows.map(([l,v]) => `<div class="fp-row"><span class="fp-lbl">${l}</span><span class="fp-val">${v}</span></div>`).join('');
  fprev.style.display = '';
  const okb = document.getElementById('okb');
  okb.textContent = source + 'から情報を取得しました。内容を確認して登録してください。';
  okb.style.display = '';
}

async function loadURL() {
  const url = document.getElementById('pu').value.trim();
  if (!url) { alert('URLを入力してください'); return; }
  const btn = document.getElementById('load-btn');
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  showLoading(true); btn.disabled = true; btn.textContent = '取得中...';
  const shopGuess = guessShop(url);
  try {
    const pr = await Promise.race([
      fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`),
      new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 8000))
    ]);
    if (!pr.ok) throw new Error('fetch failed');
    const pd = await pr.json();
    if (!pd.contents || pd.contents.length < 100) throw new Error('empty');
    const tmp = document.createElement('div');
    tmp.innerHTML = pd.contents;
    ['script','style','nav','footer','header','noscript','aside'].forEach(t => tmp.querySelectorAll(t).forEach(e => e.remove()));
    const pageText = (tmp.innerText || tmp.textContent || '').replace(/\s+/g, ' ').trim();
    const parsed = await callAI(pageText, url, shopGuess);
    if (!parsed.name && !parsed.shop) throw new Error('no data');
    applyParsed(parsed, url, shopGuess, 'ページ');
  } catch(e) {
    try {
      const parsed = await callAI('URLから推測してください。', url, shopGuess);
      if (parsed.name || parsed.shop) {
        applyParsed(parsed, url, shopGuess, 'URL');
        document.getElementById('okb').textContent += ' ※URLから推測。単価など要確認。';
      } else { throw new Error(); }
    } catch(e2) {
      if (shopGuess) document.getElementById('fs').value = shopGuess;
      document.getElementById('fu').value = url;
      document.getElementById('erb').textContent = 'ページを取得できませんでした。「テキストを貼り付ける」をお試しください。';
      document.getElementById('erb').style.display = '';
    }
  } finally {
    showLoading(false); btn.disabled = false; btn.textContent = '読み込む';
  }
}

async function parseText() {
  const text = document.getElementById('paste-text').value.trim();
  if (!text || text.length < 20) { alert('テキストを貼り付けてください'); return; }
  const btn = document.getElementById('parse-btn');
  ['okb','erb','fprev'].forEach(id => document.getElementById(id).style.display = 'none');
  showLoading(true); btn.disabled = true; btn.textContent = '解析中...';
  try {
    const parsed = await callAI(text, '', '');
    if (parsed.name || parsed.shop) { applyParsed(parsed, '', '', 'テキスト'); }
    else { throw new Error(); }
  } catch(e) {
    document.getElementById('erb').textContent = '解析できませんでした。';
    document.getElementById('erb').style.display = '';
  } finally {
    showLoading(false); btn.disabled = false; btn.textContent = '解析する';
  }
}

function renderCC() {
  const el = document.getElementById('cc-list');
  if (!cards.length) { el.innerHTML = '<p style="color:var(--text-hint);font-size:13px;padding:8px 0">登録されたカードはありません</p>'; return; }
  el.innerHTML = cards.map(c => {
    const col = BCOL[c.brand] || '#888';
    return `<div class="cc-card">
      <div class="cc-bar" style="background:${col}"></div>
      <div class="cc-name">${c.name}</div>
      ${c.last4 ? `<div class="cc-num">···· ···· ···· ${c.last4}</div>` : ''}
      <div class="cc-brand-label">${c.brand}</div>
      <div class="cc-dates">
        <div class="cc-date-item"><span class="dl">締め日</span><span class="dv">${c.closing||'—'}</span></div>
        <div class="cc-date-item"><span class="dl">支払日</span><span class="dv">${c.payment||'—'}</span></div>
      </div>
      <div class="cc-del"><button class="btn btn-sm btn-danger" onclick="delCC(${c.id})">削除</button></div>
    </div>`;
  }).join('');
}

async function addCC() {
  const name = document.getElementById('ccn').value.trim();
  if (!name) { alert('カード会社名を入力してください'); return; }
  const data = { name, brand: document.getElementById('ccb').value,
    last4: document.getElementById('ccl4').value.trim(),
    closing: document.getElementById('cccd').value.trim(),
    payment: document.getElementById('ccpd').value.trim() };
  const res = await apiFetch('add_card', data);
  cards.push({...data, id: res.id});
  ['ccn','ccl4','cccd','ccpd'].forEach(id => document.getElementById(id).value = '');
  renderCC(); toast('カードを追加しました');
}

async function delCC(id) {
  if (orders.some(o => o.ccId === id)) { if (!confirm('このカードを使用した発注があります。削除しますか？')) return; }
  else if (!confirm('削除しますか？')) return;
  await apiFetch('del_card', {id});
  cards = cards.filter(c => c.id !== id);
  renderCC(); toast('削除しました');
}

function showPayload() {
  const pl = { version:'1.0', exported_at: new Date().toISOString(), cards,
    records: orders.map(o => ({ ...o, subtotal: o.qty * o.price, card: ccBy(o.ccId) || null })) };
  document.getElementById('exp-pre').textContent = JSON.stringify(pl, null, 2);
}

function cpJSON() {
  const pl = { version:'1.0', exported_at: new Date().toISOString(), cards,
    records: orders.map(o => ({ ...o, subtotal: o.qty * o.price, card: ccBy(o.ccId) || null })) };
  navigator.clipboard.writeText(JSON.stringify(pl, null, 2)).then(() => toast('JSONをコピーしました'));
}

function dlCSV() {
  const h = 'id,発注日,商品名,仕入れ先,ブランド,数量,単価,小計,納品先,カード,ステータス,メモ';
  const rows = orders.map(o => {
    const c = ccBy(o.ccId);
    return [o.id, o.date, `"${o.name}"`, `"${o.shop||''}"`, `"${o.brand||''}"`, o.qty, o.price,
      o.qty*o.price, `"${o.client||''}"`, c?`"${c.name}"`:'' , o.status, `"${o.memo||''}"`].join(',');
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + [h,...rows].join('\n')], { type:'text/csv;charset=utf-8' }));
  a.download = `仕入れ管理_${new Date().toISOString().split('T')[0]}.csv`;
  a.click(); toast('CSVをダウンロードしました');
}

function toast(msg) {
  const t = document.getElementById('tst');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2500);
}

// Init — open on 新規登録
(async () => {
  [orders, cards] = await Promise.all([apiFetch('orders'), apiFetch('cards')]);
  swNav('add', document.querySelectorAll('.bnav-item')[1]);
})();
</script>
