<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デザイン文字生成システム</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "BIZ UDGothic", "Meiryo", "Yu Gothic", sans-serif;
      background: #0f0f14;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ---- ヘッダー ---- */
    header {
      text-align: center;
      margin-bottom: 44px;
    }
    header h1 {
      font-size: 1.7rem;
      font-weight: bold;
      letter-spacing: .08em;
      color: #fff;
    }
    header p {
      margin-top: 8px;
      font-size: .85rem;
      color: #888;
    }

    /* ---- メインカード ---- */
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 18px;
      padding: 36px 40px;
      width: 100%;
      max-width: 680px;
    }

    /* ---- フォームグループ ---- */
    .form-group {
      margin-bottom: 26px;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: bold;
      color: #aaa;
      letter-spacing: .06em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* テキスト入力 */
    textarea {
      width: 100%;
      background: #111118;
      border: 1.5px solid #2e2e42;
      border-radius: 10px;
      color: #fff;
      font-size: 1.6rem;
      font-family: inherit;
      padding: 14px 16px;
      resize: vertical;
      min-height: 80px;
      transition: border-color .2s;
      outline: none;
    }
    textarea:focus { border-color: #7c6ef5; }

    /* ---- カラー & サイズ 横並び ---- */
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* カラーピッカー */
    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      width: 52px;
      height: 52px;
      border: 2px solid #3a3a50;
      border-radius: 10px;
      cursor: pointer;
      padding: 2px;
      background: #111118;
    }
    .hex-input {
      background: #111118;
      border: 1.5px solid #2e2e42;
      border-radius: 8px;
      color: #fff;
      font-size: .95rem;
      font-family: monospace;
      padding: 10px 12px;
      width: 110px;
      outline: none;
      transition: border-color .2s;
    }
    .hex-input:focus { border-color: #7c6ef5; }

    /* プリセットカラー */
    .preset-colors {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .preset-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }
    .preset-dot:hover { transform: scale(1.2); }
    .preset-dot.active { border-color: #fff; }

    /* フォントサイズ */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #2e2e42;
      border-radius: 3px;
      outline: none;
      margin-top: 6px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #7c6ef5;
      cursor: pointer;
      border: 2px solid #fff;
    }
    .size-display {
      text-align: right;
      font-size: .9rem;
      color: #7c6ef5;
      margin-top: 6px;
      font-weight: bold;
    }

    /* ---- 生成ボタン ---- */
    .btn-generate {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #7c6ef5 0%, #a78bfa 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: .1em;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: 4px;
    }
    .btn-generate:hover  { opacity: .9; }
    .btn-generate:active { transform: scale(.98); }
    .btn-generate:disabled { opacity: .4; cursor: not-allowed; }

    /* ---- プレビューエリア ---- */
    .preview-area {
      margin-top: 36px;
      text-align: center;
      display: none;
    }
    .preview-area.visible { display: block; }

    .preview-label {
      font-size: .75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 16px;
    }

    .preview-box {
      background: repeating-conic-gradient(#1e1e2c 0% 25%, #17171f 25% 50%)
                  0 0 / 20px 20px;
      border: 1.5px solid #2a2a38;
      border-radius: 14px;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 140px;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
    }

    .preview-meta {
      margin-top: 10px;
      font-size: .78rem;
      color: #555;
    }

    /* ---- ダウンロードボタン ---- */
    .btn-download {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 32px;
      background: #1e2a40;
      border: 1.5px solid #3a5070;
      border-radius: 10px;
      color: #7ac0ff;
      font-size: .95rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
    }
    .btn-download:hover { background: #243450; }

    /* ---- ローディング ---- */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- フォント選択 ---- */
    .font-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .font-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #111118;
      border: 1.5px solid #2e2e42;
      border-radius: 9px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .font-option:hover  { border-color: #5a5a80; }
    .font-option.active { border-color: #7c6ef5; background: #1a1a30; }
    .font-option input[type="radio"] { display: none; }
    .font-radio-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid #444;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .font-option.active .font-radio-dot {
      border-color: #7c6ef5;
    }
    .font-radio-dot::after {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #7c6ef5;
      display: none;
    }
    .font-option.active .font-radio-dot::after { display: block; }
    .font-label-text {
      font-size: .85rem;
      color: #ccc;
      line-height: 1.3;
    }

    /* ---- エラー ---- */
    .error-msg {
      color: #ff6b6b;
      font-size: .85rem;
      margin-top: 10px;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

<header>
  <h1>デザイン文字生成システム</h1>
  <p>ステッカースタイルの背景透過PNG画像を生成します</p>
</header>

<div class="card">

  <!-- テキスト入力 -->
  <div class="form-group">
    <label>テキスト</label>
    <textarea id="textInput" placeholder="例: AI営業マスター" rows="2"></textarea>
  </div>

  <!-- フォント選択 -->
  <div class="form-group">
    <label>フォント</label>
    <div class="font-list" id="fontList">
      <!-- JS で動的生成 -->
    </div>
  </div>

  <div class="row-2">

    <!-- カラー -->
    <div class="form-group">
      <label>カラー</label>
      <div class="color-row">
        <input type="color" id="colorPicker" value="#FF88BB" />
        <input type="text"  id="hexInput" class="hex-input" value="#FF88BB" maxlength="7" />
      </div>
      <div class="preset-colors" id="presetColors"></div>
    </div>

    <!-- フォントサイズ -->
    <div class="form-group">
      <label>文字サイズ</label>
      <input type="range" id="fontSizeSlider" min="80" max="500" value="200" step="10" />
      <div class="size-display"><span id="fontSizeValue">200</span> px</div>
    </div>

  </div>

  <button class="btn-generate" id="generateBtn" onclick="generate()">
    生 成
  </button>
  <div class="error-msg" id="errorMsg"></div>

</div>

<!-- プレビュー -->
<div class="preview-area" id="previewArea">
  <div class="preview-label">プレビュー（背景はチェッカーで表示）</div>
  <div class="preview-box">
    <img id="previewImg" src="" alt="preview" />
  </div>
  <div class="preview-meta" id="previewMeta"></div>
  <a class="btn-download" id="downloadBtn" href="#" download>PNG ダウンロード</a>
</div>

<script>
  // ---- フォント一覧をサーバーから取得してレンダリング ----
  let selectedFontId = null;

  async function loadFonts() {
    const res   = await fetch("/fonts");
    const fonts = await res.json();
    const list  = document.getElementById("fontList");
    list.innerHTML = "";

    fonts.forEach((f, i) => {
      const row = document.createElement("div");
      row.className = "font-option" + (i === 0 ? " active" : "");
      row.dataset.id = f.id;
      row.innerHTML = `
        <div class="font-radio-dot"></div>
        <span class="font-label-text">${f.label}</span>
      `;
      row.addEventListener("click", () => {
        list.querySelectorAll(".font-option").forEach(el => el.classList.remove("active"));
        row.classList.add("active");
        selectedFontId = f.id;
      });
      list.appendChild(row);
      if (i === 0) selectedFontId = f.id;
    });
  }
  loadFonts();

  // ---- プリセットカラー ----
  const PRESETS = [
    "#FF88BB", "#FFEE55", "#88EEFF", "#BBFF66",
    "#FF7755", "#AA88FF", "#55DDAA", "#FFFFFF",
  ];
  const presetContainer = document.getElementById("presetColors");
  let activeDot = null;

  PRESETS.forEach((hex) => {
    const dot = document.createElement("div");
    dot.className = "preset-dot";
    dot.style.background = hex;
    dot.title = hex;
    dot.addEventListener("click", () => {
      setColor(hex);
      if (activeDot) activeDot.classList.remove("active");
      dot.classList.add("active");
      activeDot = dot;
    });
    presetContainer.appendChild(dot);
    if (hex === "#FF88BB") { dot.classList.add("active"); activeDot = dot; }
  });

  function setColor(hex) {
    document.getElementById("colorPicker").value = hex;
    document.getElementById("hexInput").value    = hex;
  }

  document.getElementById("colorPicker").addEventListener("input", (e) => {
    document.getElementById("hexInput").value = e.target.value;
    if (activeDot) { activeDot.classList.remove("active"); activeDot = null; }
  });

  document.getElementById("hexInput").addEventListener("input", (e) => {
    const val = e.target.value;
    if (/^#[0-9a-fA-F]{6}$/.test(val)) {
      document.getElementById("colorPicker").value = val;
    }
  });

  // ---- フォントサイズ ----
  const slider = document.getElementById("fontSizeSlider");
  slider.addEventListener("input", () => {
    document.getElementById("fontSizeValue").textContent = slider.value;
  });

  // ---- 生成 ----
  async function generate() {
    const text      = document.getElementById("textInput").value.trim();
    const colorHex  = document.getElementById("hexInput").value;
    const fontSize  = parseInt(slider.value);
    const btn       = document.getElementById("generateBtn");
    const errEl     = document.getElementById("errorMsg");

    if (!text) {
      showError("テキストを入力してください");
      return;
    }

    errEl.classList.remove("visible");
    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner"></span> 生成中...';

    try {
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, color: colorHex, font_size: fontSize, font_id: selectedFontId }),
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || "生成に失敗しました");
        return;
      }

      const img      = document.getElementById("previewImg");
      const dlBtn    = document.getElementById("downloadBtn");
      const metaEl   = document.getElementById("previewMeta");
      const previewA = document.getElementById("previewArea");

      img.src         = data.image_data;
      dlBtn.href      = `/download/${data.filename}`;
      dlBtn.download  = data.filename;
      metaEl.textContent = `${data.width} × ${data.height} px`;
      previewA.classList.add("visible");

    } catch (e) {
      showError("通信エラーが発生しました");
    } finally {
      btn.disabled  = false;
      btn.innerHTML = "生 成";
    }
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.classList.add("visible");
  }

  // Enter キーで生成
  document.getElementById("textInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      generate();
    }
  });
</script>
</body>
</html>
