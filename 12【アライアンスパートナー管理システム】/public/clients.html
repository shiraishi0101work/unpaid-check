</head>

<main class="main">
  <div class="page-header">
    <h2>エンド一覧</h2>
    <p>自社の直接売上先（エンドクライアント）を管理します</p>
  </div>

  <div id="alert"></div>

  <div class="card">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div class="toolbar" style="margin:0;flex:1;min-width:240px">
        <div class="search-wrap">
          <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="text" id="searchInput" placeholder="会社名・担当者名で検索..." oninput="loadClients()">
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button class="btn btn-primary" onclick="openAddModal()">+ エンド追加</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>会社名</th>
            <th>担当者</th>
            <th>電話</th>
            <th>メール</th>
            <th>請求件数</th>
            <th>備考</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" class="text-muted" style="text-align:center;padding:30px">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="countLabel" style="font-size:13px;color:var(--text-muted);margin-top:12px"></div>
  </div>
</main>

<!-- 追加モーダル -->
<div class="modal-overlay" id="addModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>エンド追加</h3>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>会社名 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="a_company_name" placeholder="株式会社〇〇">
      </div>
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="a_contact_name" placeholder="山田 太郎">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="a_contact_email" placeholder="yamada@example.com">
      </div>
      <div class="form-group">
        <label>電話番号</label>
        <input type="tel" id="a_contact_phone" placeholder="03-0000-0000">
      </div>
      <div class="form-group full">
        <label>備考</label>
        <textarea id="a_notes" placeholder="メモ・特記事項など"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveNewClient()">登録</button>
    </div>
  </div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editModalTitle">エンド編集</h3>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>会社名 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="e_company_name">
      </div>
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="e_contact_name">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="e_contact_email">
      </div>
      <div class="form-group">
        <label>電話番号</label>
        <input type="tel" id="e_contact_phone">
      </div>
      <div class="form-group full">
        <label>備考</label>
        <textarea id="e_notes"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditModal()">閉じる</button>
      <button class="btn btn-primary" onclick="saveEditClient()">保存</button>
    </div>
  </div>
</div>

<script>
let currentEditId = null;
let invoiceCounts = {};

async function init() {
  // 請求件数を事前取得
  const invoices = await fetch('/api/invoices').then(r => r.json());
  for (const inv of invoices) {
    if (inv.client_id) {
      invoiceCounts[inv.client_id] = (invoiceCounts[inv.client_id] || 0) + 1;
    }
  }
  loadClients();
}

async function loadClients() {
  const search = document.getElementById('searchInput').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);

  const data = await fetch('/api/clients?' + params).then(r => r.json());
  const tbody = document.getElementById('tableBody');

  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center;padding:30px">エンドが登録されていません</td></tr>';
  } else {
    tbody.innerHTML = data.map(c => `
      <tr>
        <td><strong>${esc(c.company_name)}</strong></td>
        <td>${esc(c.contact_name || '-')}</td>
        <td>${esc(c.contact_phone || '-')}</td>
        <td style="font-size:12px;color:var(--text-muted)">${esc(c.contact_email || '-')}</td>
        <td>
          ${(invoiceCounts[c.id] || 0) > 0
            ? `<span class="badge badge-blue">${invoiceCounts[c.id]}件</span>`
            : '<span class="text-muted" style="font-size:12px">なし</span>'}
        </td>
        <td style="font-size:12px;color:var(--text-muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.notes || '')}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal(${c.id})">編集</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteClient(${c.id}, '${esc(c.company_name)}')" style="color:var(--danger)">削除</button>
        </td>
      </tr>
    `).join('');
  }
  document.getElementById('countLabel').textContent = `${data.length}件`;
}

function openAddModal() {
  ['a_company_name','a_contact_name','a_contact_email','a_contact_phone','a_notes']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('addModalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('a_company_name').focus(), 50);
}
function closeAddModal() { document.getElementById('addModalOverlay').classList.remove('open'); }

async function saveNewClient() {
  const body = {
    company_name:  document.getElementById('a_company_name').value.trim(),
    contact_name:  document.getElementById('a_contact_name').value.trim(),
    contact_email: document.getElementById('a_contact_email').value.trim(),
    contact_phone: document.getElementById('a_contact_phone').value.trim(),
    notes:         document.getElementById('a_notes').value.trim(),
  };
  if (!body.company_name) { alert('会社名を入力してください'); return; }

  const res = await fetch('/api/clients', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { showAlert(data.error, 'error'); return; }
  closeAddModal();
  showAlert('登録しました');
  loadClients();
}

async function openEditModal(id) {
  currentEditId = id;
  const c = await fetch(`/api/clients/${id}`).then(r => r.json());
  document.getElementById('editModalTitle').textContent = `${c.company_name} — 編集`;
  document.getElementById('e_company_name').value  = c.company_name || '';
  document.getElementById('e_contact_name').value  = c.contact_name || '';
  document.getElementById('e_contact_email').value = c.contact_email || '';
  document.getElementById('e_contact_phone').value = c.contact_phone || '';
  document.getElementById('e_notes').value         = c.notes || '';
  document.getElementById('editModalOverlay').classList.add('open');
}
function closeEditModal() { document.getElementById('editModalOverlay').classList.remove('open'); currentEditId = null; }

async function saveEditClient() {
  const body = {
    company_name:  document.getElementById('e_company_name').value.trim(),
    contact_name:  document.getElementById('e_contact_name').value.trim(),
    contact_email: document.getElementById('e_contact_email').value.trim(),
    contact_phone: document.getElementById('e_contact_phone').value.trim(),
    notes:         document.getElementById('e_notes').value.trim(),
  };
  if (!body.company_name) { alert('会社名を入力してください'); return; }
  const res = await fetch(`/api/clients/${currentEditId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();
  showAlert(data.message || '更新しました', res.ok ? 'success' : 'error');
  if (res.ok) { loadClients(); document.getElementById('editModalTitle').textContent = `${body.company_name} — 編集`; }
}

async function deleteClient(id, name) {
  if (!confirm(`「${name}」を削除しますか？\n関連する請求書の紐づけも解除されます。`)) return;
  const res = await fetch(`/api/clients/${id}`, { method:'DELETE' });
  const data = await res.json();
  showAlert(data.message, res.ok ? 'success' : 'error');
  if (res.ok) loadClients();
}

function showAlert(msg, type = 'success') {
  const el = document.getElementById('alert');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('addModalOverlay').addEventListener('click', e => { if (e.target.id === 'addModalOverlay') closeAddModal(); });
document.getElementById('editModalOverlay').addEventListener('click', e => { if (e.target.id === 'editModalOverlay') closeEditModal(); });

init();
</script>
</body>
</html>
