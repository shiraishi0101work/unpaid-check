<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>請求書管理 — アライアンスパートナー管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>アライアンス<br>パートナー管理</h1>
    <span>Alliance Partner System</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">メニュー</div>
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span>ダッシュボード</span>
    </a>
    <a href="partners.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <span>パートナー一覧</span>
    </a>
    <a href="products.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
      <span>商材一覧</span>
    </a>
    <a href="invoices.html" class="nav-item active">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
      <span>請求書管理</span>
    </a>
    <a href="monthly.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
      <span>月別集計</span>
    </a>
  </nav>
</aside>

<main class="main">
  <div class="page-header">
    <h2>請求書管理</h2>
    <p>PDFをアップロードするか、手動で請求データを入力します</p>
  </div>

  <div id="alert"></div>

  <!-- Upload zone -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-header">
      <h3>請求書アップロード</h3>
      <button class="btn btn-outline btn-sm" onclick="openManualModal()">+ 手動入力</button>
    </div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      </div>
      <p><strong>PDFをクリックまたはドラッグ&ドロップ</strong></p>
      <p style="color:var(--text-muted);font-size:13px">最大20枚まで同時アップロード可能</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" multiple style="display:none" onchange="uploadFiles(this)">
    <div id="uploadProgress" style="display:none;margin-top:12px">
      <p id="uploadProgressText" style="font-size:13px;color:var(--primary)">アップロード・解析中...</p>
    </div>
    <!-- 一括アップロード結果 -->
    <div id="bulkResult" style="display:none;margin-top:16px"></div>
  </div>

  <!-- Invoice list -->
  <div class="card">
    <div class="card-header">
      <div class="toolbar" style="margin:0;flex:1;flex-wrap:wrap">
        <select id="filterPartner" onchange="loadInvoices()" style="min-width:160px">
          <option value="">すべてのパートナー</option>
        </select>
        <input type="month" id="filterMonth" onchange="loadInvoices()" style="min-width:150px">
        <select id="filterStatus" onchange="loadInvoices()" style="min-width:120px">
          <option value="">すべての状態</option>
          <option value="confirmed">確定済み</option>
          <option value="pending">未確定</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">クリア</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>パートナー</th>
            <th>請求月</th>
            <th>金額</th>
            <th>状態</th>
            <th>ファイル</th>
            <th>登録日</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" class="text-muted" style="text-align:center;padding:30px">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="countLabel" style="font-size:13px;color:var(--text-muted);margin-top:12px"></div>
  </div>
</main>

<!-- 請求書確定モーダル（PDF後・手動） -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal wide">
    <div class="modal-header">
      <h3 id="modalTitle">請求書入力</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <!-- PDF抽出テキスト表示 -->
    <div id="extractedSection" style="display:none;margin-bottom:16px">
      <label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">PDF抽出テキスト（参考）</label>
      <textarea id="extractedText" style="height:100px;font-size:12px;background:#f8fafc;color:var(--text-muted);margin-top:6px" readonly></textarea>
    </div>

    <div class="form-grid cols-3">
      <div class="form-group">
        <label>パートナー <span style="color:var(--danger)">*</span></label>
        <select id="f_partner_id">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-group">
        <label>請求月 <span style="color:var(--danger)">*</span></label>
        <input type="month" id="f_billing_month">
      </div>
      <div class="form-group">
        <label>請求金額合計（円）</label>
        <input type="number" id="f_total_amount" placeholder="0" min="0" oninput="syncTotal()">
      </div>
      <div class="form-group full">
        <label>備考</label>
        <input type="text" id="f_notes" placeholder="メモなど">
      </div>
    </div>

    <!-- 明細 -->
    <div class="items-section">
      <h4>明細（任意）</h4>
      <table class="items-table">
        <thead>
          <tr>
            <th>品目・商材</th>
            <th>数量</th>
            <th>単価</th>
            <th>金額</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="btn btn-outline btn-sm add-item-btn" onclick="addItem()">+ 明細追加</button>
      <div style="text-align:right;margin-top:8px;font-size:14px">
        合計: <strong id="itemsTotal" style="color:var(--primary);font-size:16px">¥0</strong>
        <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="applyItemsTotal()" title="明細合計を請求金額に反映">反映</button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-success" onclick="saveInvoice()">確定・保存</button>
    </div>
  </div>
</div>

<script>
let editInvoiceId = null;
let partners = [];
let products = [];
const fmt = n => '¥' + Number(n || 0).toLocaleString();

async function init() {
  partners = await fetch('/api/partners').then(r => r.json());
  products = await fetch('/api/products').then(r => r.json());

  const sel = document.getElementById('f_partner_id');
  partners.forEach(p => {
    sel.innerHTML += `<option value="${p.id}">${p.company_name}</option>`;
  });

  const filterSel = document.getElementById('filterPartner');
  partners.forEach(p => {
    filterSel.innerHTML += `<option value="${p.id}">${p.company_name}</option>`;
  });

  setupDragDrop();
  loadInvoices();
}

async function loadInvoices() {
  const partnerId = document.getElementById('filterPartner').value;
  const month     = document.getElementById('filterMonth').value;
  const status    = document.getElementById('filterStatus').value;
  const params    = new URLSearchParams();
  if (partnerId) params.set('partner_id', partnerId);
  if (month)     params.set('month', month);
  if (status)    params.set('status', status);

  const data = await fetch('/api/invoices?' + params).then(r => r.json());
  const tbody = document.getElementById('tableBody');

  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center;padding:30px">請求書がありません</td></tr>';
  } else {
    tbody.innerHTML = data.map(i => `
      <tr>
        <td><strong>${i.partner_name || '<span class="text-muted">未設定</span>'}</strong></td>
        <td>${i.billing_month || '-'}</td>
        <td style="text-align:right;font-weight:700;color:var(--primary)">${fmt(i.total_amount)}</td>
        <td>${i.status === 'confirmed'
              ? '<span class="badge badge-green">確定</span>'
              : '<span class="badge badge-yellow">未確定</span>'}</td>
        <td style="font-size:12px;color:var(--text-muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.file_name || '-'}</td>
        <td style="color:var(--text-muted);font-size:12px">${i.created_at?.slice(0,10) || '-'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost btn-sm" onclick="editInvoice(${i.id})">編集</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteInvoice(${i.id})" style="color:var(--danger)">削除</button>
        </td>
      </tr>
    `).join('');
  }
  document.getElementById('countLabel').textContent = `${data.length}件`;
}

function clearFilters() {
  document.getElementById('filterPartner').value = '';
  document.getElementById('filterMonth').value = '';
  document.getElementById('filterStatus').value = '';
  loadInvoices();
}

// ── Upload ──
async function uploadFiles(input) {
  const files = Array.from(input.files);
  if (!files.length) return;

  if (files.length === 1) {
    // 単体はモーダルで確認
    document.getElementById('uploadProgress').style.display = 'block';
    document.getElementById('uploadProgressText').textContent = 'アップロード・解析中...';
    const formData = new FormData();
    formData.append('file', files[0]);
    const res = await fetch('/api/invoices/upload', { method: 'POST', body: formData });
    const data = await res.json();
    document.getElementById('uploadProgress').style.display = 'none';
    input.value = '';
    openModal(data.id, data);
    return;
  }

  // 複数ファイル一括処理
  if (files.length > 20) { showAlert('一度にアップロードできるのは20枚までです', 'error'); return; }

  document.getElementById('uploadProgress').style.display = 'block';
  document.getElementById('bulkResult').style.display = 'none';
  document.getElementById('uploadProgressText').textContent = `${files.length}枚をアップロード・解析中...`;

  const formData = new FormData();
  files.forEach(f => formData.append('files', f));

  const res = await fetch('/api/invoices/upload-bulk', { method: 'POST', body: formData });
  const data = await res.json();
  document.getElementById('uploadProgress').style.display = 'none';
  input.value = '';

  if (!res.ok) { showAlert(data.error || 'アップロードに失敗しました', 'error'); return; }

  showBulkResult(data.results);
  loadInvoices();
}

function showBulkResult(results) {
  const autoConfirmed = results.filter(r => r.auto_confirmed);
  const needReview    = results.filter(r => !r.auto_confirmed);

  const rows = results.map(r => {
    const statusCell = r.auto_confirmed
      ? `<span style="padding:2px 8px;border-radius:4px;background:#d1fae5;color:#065f46;font-size:11px;font-weight:600">自動確定</span>`
      : `<span style="padding:2px 8px;border-radius:4px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:600">要確認</span>`;
    return `
      <tr style="${r.auto_confirmed ? '' : 'background:#fffbeb'}">
        <td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.file_name}</td>
        <td>${r.guessed_partner_name ? `<strong>${r.guessed_partner_name}</strong>` : '<span class="text-muted">未検出</span>'}</td>
        <td>${r.guessed_month || '<span class="text-muted">未検出</span>'}</td>
        <td style="text-align:right">${r.guessed_amount ? fmt(r.guessed_amount) : '-'}</td>
        <td>${statusCell}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="editInvoice(${r.id})">編集</button></td>
      </tr>
    `;
  }).join('');

  document.getElementById('bulkResult').style.display = 'block';
  document.getElementById('bulkResult').innerHTML = `
    <div style="background:#f0f9ff;border:1px solid #bfdbfe;border-radius:8px;padding:16px">
      <div style="display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
        <span style="font-size:13px;font-weight:700">${results.length}枚 アップロード完了</span>
        ${autoConfirmed.length ? `<span style="padding:3px 10px;border-radius:20px;background:#d1fae5;color:#065f46;font-size:12px;font-weight:600">自動確定: ${autoConfirmed.length}件</span>` : ''}
        ${needReview.length    ? `<span style="padding:3px 10px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:600">要確認: ${needReview.length}件</span>` : ''}
      </div>
      <div style="overflow-x:auto">
        <table style="font-size:13px;width:100%">
          <thead><tr><th>ファイル名</th><th>パートナー</th><th>請求月</th><th>金額</th><th>状態</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${needReview.length ? '<p style="font-size:12px;color:var(--text-muted);margin-top:8px">⚠ 黄色の行はパートナーを手動で確認・設定してください</p>' : ''}
    </div>
  `;
}

function setupDragDrop() {
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files.length) {
      const input = document.getElementById('fileInput');
      const dt = new DataTransfer();
      Array.from(files).forEach(f => dt.items.add(f));
      input.files = dt.files;
      uploadFiles(input);
    }
  });
}

// ── Modal ──
function openModal(id = null, guessed = null) {
  editInvoiceId = id;
  clearForm();
  document.getElementById('modalTitle').textContent = id ? '請求書確認・編集' : '請求書入力';

  if (guessed) {
    if (guessed.guessed_partner_id) document.getElementById('f_partner_id').value = guessed.guessed_partner_id;
    if (guessed.guessed_month)  document.getElementById('f_billing_month').value = guessed.guessed_month;
    if (guessed.guessed_amount) document.getElementById('f_total_amount').value  = guessed.guessed_amount;
    if (guessed.extracted_text) {
      document.getElementById('extractedSection').style.display = 'block';
      const debugLine = guessed.name_from_pdf
        ? `【PDF抽出名: "${guessed.name_from_pdf}"】\n`
        : '【PDF抽出名: 未検出（御中・様が見つかりませんでした）】\n';
      document.getElementById('extractedText').value = debugLine + guessed.extracted_text;
    }
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function openManualModal() {
  openModal(null, null);
  document.getElementById('extractedSection').style.display = 'none';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editInvoiceId = null;
}

function clearForm() {
  document.getElementById('f_partner_id').value = '';
  document.getElementById('f_billing_month').value = '';
  document.getElementById('f_total_amount').value = '';
  document.getElementById('f_notes').value = '';
  document.getElementById('extractedSection').style.display = 'none';
  document.getElementById('extractedText').value = '';
  document.getElementById('itemsBody').innerHTML = '';
  calcItemsTotal();
}

async function editInvoice(id) {
  const data = await fetch(`/api/invoices/${id}`).then(r => r.json());
  editInvoiceId = id;
  clearForm();
  document.getElementById('modalTitle').textContent = '請求書編集';
  document.getElementById('f_partner_id').value    = data.partner_id || '';
  document.getElementById('f_billing_month').value = data.billing_month || '';
  document.getElementById('f_total_amount').value  = data.total_amount || '';
  document.getElementById('f_notes').value         = data.notes || '';

  if (data.extracted_text) {
    document.getElementById('extractedSection').style.display = 'block';
    document.getElementById('extractedText').value = data.extracted_text;
  }

  for (const item of (data.items || [])) addItem(item);
  calcItemsTotal();
  document.getElementById('modalOverlay').classList.add('open');
}

async function saveInvoice() {
  const partner_id    = document.getElementById('f_partner_id').value;
  const billing_month = document.getElementById('f_billing_month').value;
  const total_amount  = parseInt(document.getElementById('f_total_amount').value) || 0;
  const notes         = document.getElementById('f_notes').value.trim();

  if (!partner_id)    { alert('パートナーを選択してください'); return; }
  if (!billing_month) { alert('請求月を選択してください'); return; }

  const items = collectItems();
  const body = { partner_id: parseInt(partner_id), billing_month, total_amount, notes, status: 'confirmed', items };

  const url    = editInvoiceId ? `/api/invoices/${editInvoiceId}` : '/api/invoices';
  const method = editInvoiceId ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();

  showAlert(data.message || '保存しました', res.ok ? 'success' : 'error');
  if (res.ok) { closeModal(); loadInvoices(); }
}

async function deleteInvoice(id) {
  if (!confirm('この請求書を削除しますか？')) return;
  const res = await fetch(`/api/invoices/${id}`, { method: 'DELETE' });
  const data = await res.json();
  showAlert(data.message, res.ok ? 'success' : 'error');
  if (res.ok) loadInvoices();
}

// ── Items ──
function addItem(item = null) {
  const tbody = document.getElementById('itemsBody');
  const productOptions = products.map(p => `<option value="${p.id}" ${item?.product_id === p.id ? 'selected':''}>${p.name}</option>`).join('');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>
      <select style="width:100%;font-size:13px" onchange="onProductSelect(this)">
        <option value="">（商材を選択）</option>
        ${productOptions}
      </select>
      <input type="text" placeholder="品目名" value="${item?.description || ''}" style="width:100%;margin-top:4px;font-size:12px">
    </td>
    <td><input type="number" value="${item?.quantity || 1}" min="1" style="width:60px" oninput="calcRow(this)"></td>
    <td><input type="number" value="${item?.unit_price || ''}" placeholder="0" style="width:90px" oninput="calcRow(this)"></td>
    <td><input type="number" value="${item?.amount || ''}" placeholder="0" style="width:90px" oninput="calcItemsTotal()"></td>
    <td><button class="btn btn-ghost btn-sm" onclick="this.closest('tr').remove();calcItemsTotal()">✕</button></td>
  `;
  tbody.appendChild(tr);
  calcItemsTotal();
}

function onProductSelect(sel) {
  const p = products.find(x => x.id == sel.value);
  if (!p) return;
  const row = sel.closest('tr');
  row.querySelector('input[type="text"]').value = p.name;
  row.querySelector('input[placeholder="0"]').value = p.unit_price;
  calcRow(row.querySelector('input[type="number"]'));
}

function calcRow(input) {
  const row = input.closest('tr');
  const qty  = parseFloat(row.querySelectorAll('input[type="number"]')[0].value) || 0;
  const unit = parseFloat(row.querySelectorAll('input[type="number"]')[1].value) || 0;
  row.querySelectorAll('input[type="number"]')[2].value = Math.round(qty * unit);
  calcItemsTotal();
}

function calcItemsTotal() {
  let total = 0;
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const amountInput = tr.querySelectorAll('input[type="number"]')[2];
    total += parseFloat(amountInput?.value || 0);
  });
  document.getElementById('itemsTotal').textContent = fmt(total);
}

function syncTotal() { calcItemsTotal(); }

function applyItemsTotal() {
  let total = 0;
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const amountInput = tr.querySelectorAll('input[type="number"]')[2];
    total += parseFloat(amountInput?.value || 0);
  });
  document.getElementById('f_total_amount').value = total;
}

function collectItems() {
  const items = [];
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const sel   = tr.querySelector('select');
    const desc  = tr.querySelector('input[type="text"]')?.value.trim();
    const nums  = tr.querySelectorAll('input[type="number"]');
    const qty   = parseInt(nums[0]?.value) || 1;
    const unit  = parseInt(nums[1]?.value) || 0;
    const amt   = parseInt(nums[2]?.value) || 0;
    if (desc || amt) items.push({ product_id: sel?.value || null, description: desc, quantity: qty, unit_price: unit, amount: amt });
  });
  return items;
}

function showAlert(msg, type = 'success') {
  const el = document.getElementById('alert');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 3000);
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

init();
</script>
</body>
</html>
