<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ダッシュボード — アライアンスパートナー管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>アライアンス<br>パートナー管理</h1>
    <span>Alliance Partner System</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">メニュー</div>
    <a href="index.html" class="nav-item active">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span>ダッシュボード</span>
    </a>
    <a href="partners.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <span>パートナー一覧</span>
    </a>
    <a href="products.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
      <span>商材一覧</span>
    </a>
    <a href="invoices.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
      <span>請求書管理</span>
    </a>
    <a href="monthly.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
      <span>月別集計</span>
    </a>
  </nav>
</aside>

<!-- Main -->
<main class="main">
  <div class="page-header">
    <h2>ダッシュボード</h2>
    <p id="currentDate"></p>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">今月請求合計</div>
      <div class="stat-value" id="monthlyTotal">-</div>
      <div class="stat-sub" id="thisMonthLabel">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">年間請求合計</div>
      <div class="stat-value" id="yearlyTotal">-</div>
      <div class="stat-sub" id="yearLabel">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">アクティブパートナー</div>
      <div class="stat-value" id="partnerCount">-</div>
      <div class="stat-sub">社</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">未確定請求書</div>
      <div class="stat-value" id="pendingCount" style="color:#d97706">-</div>
      <div class="stat-sub">件</div>
    </div>
  </div>

  <div class="grid-2">
    <!-- Top Partners -->
    <div class="card">
      <div class="card-header">
        <h3>今年度 パートナー別請求ランキング</h3>
      </div>
      <div id="topPartners">
        <p class="text-muted" style="font-size:13px;">データを読み込み中...</p>
      </div>
    </div>

    <!-- Recent Invoices -->
    <div class="card">
      <div class="card-header">
        <h3>最近の請求書</h3>
        <a href="invoices.html" class="btn btn-outline btn-sm">すべて見る</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>パートナー</th><th>請求月</th><th>金額</th><th>状態</th>
          </tr></thead>
          <tbody id="recentInvoices">
            <tr><td colspan="4" class="text-muted" style="text-align:center;padding:20px">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
const fmt = n => n ? '¥' + Number(n).toLocaleString() : '¥0';

async function loadDashboard() {
  const data = await fetch('/api/dashboard').then(r => r.json());

  const now = new Date();
  document.getElementById('currentDate').textContent = now.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  document.getElementById('thisMonthLabel').textContent = data.thisMonth;
  document.getElementById('yearLabel').textContent = now.getFullYear() + '年度';

  document.getElementById('monthlyTotal').textContent = fmt(data.monthlyTotal);
  document.getElementById('yearlyTotal').textContent = fmt(data.yearlyTotal);
  document.getElementById('partnerCount').textContent = data.partnerCount;
  document.getElementById('pendingCount').textContent = data.pendingCount;

  // Top partners
  const maxAmount = data.topPartners[0]?.total || 1;
  const topEl = document.getElementById('topPartners');
  if (data.topPartners.length === 0) {
    topEl.innerHTML = '<p class="text-muted" style="font-size:13px">データがありません</p>';
  } else {
    topEl.innerHTML = data.topPartners.map(p => `
      <div class="partner-bar">
        <div class="partner-bar-label">
          <span style="font-weight:600">${p.company_name}</span>
          <span style="color:var(--primary);font-weight:700">${fmt(p.total)}</span>
        </div>
        <div class="partner-bar-track">
          <div class="partner-bar-fill" style="width:${Math.round(p.total/maxAmount*100)}%"></div>
        </div>
      </div>
    `).join('');
  }

  // Recent invoices
  const tbody = document.getElementById('recentInvoices');
  if (data.recentInvoices.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-muted" style="text-align:center;padding:20px">請求書がありません</td></tr>';
  } else {
    tbody.innerHTML = data.recentInvoices.map(i => `
      <tr>
        <td>${i.partner_name || '<span class="text-muted">未設定</span>'}</td>
        <td>${i.billing_month || '-'}</td>
        <td style="text-align:right;font-weight:600">${fmt(i.total_amount)}</td>
        <td>${statusBadge(i.status)}</td>
      </tr>
    `).join('');
  }
}

function statusBadge(s) {
  if (s === 'confirmed') return '<span class="badge badge-green">確定</span>';
  return '<span class="badge badge-yellow">未確定</span>';
}

loadDashboard();
</script>
</body>
</html>
