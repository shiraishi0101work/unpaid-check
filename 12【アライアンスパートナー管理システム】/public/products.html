<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>商材一覧 — アライアンスパートナー管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <span>Alliance Partner System</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">メニュー</div>
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span>ダッシュボード</span>
    </a>
    <a href="partners.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      <span>パートナー一覧</span>
    </a>
    <a href="products.html" class="nav-item active">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>
      <span>商材一覧</span>
    </a>
    <a href="invoices.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
      <span>請求書管理</span>
    </a>
    <a href="monthly.html" class="nav-item">
      <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
      <span>月別集計</span>
    </a>
  </nav>
</aside>

<main class="main">
  <div class="page-header">
    <h2>商材一覧</h2>
    <p>パートナーが取り扱う商材・サービスを管理します</p>
  </div>

  <div id="alert"></div>

  <div class="card">
    <div class="card-header">
      <div class="toolbar" style="margin:0;flex:1;gap:8px">
        <div class="search-wrap">
          <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="text" id="searchInput" placeholder="商材名・分類で検索..." oninput="loadProducts()">
        </div>
        <select id="categoryFilter" onchange="loadProducts()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:white;color:var(--text);min-width:140px">
          <option value="">すべての分類</option>
        </select>
      </div>
      <button class="btn btn-ghost" onclick="openCsvModal()" style="display:flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        CSV一括登録
      </button>
      <button class="btn btn-primary" onclick="openModal()">+ 商材追加</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>分類</th>
            <th>商材名</th>
            <th style="text-align:right">日額単価</th>
            <th style="text-align:right">月額</th>
            <th>説明</th>
            <th>登録日</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" class="text-muted" style="text-align:center;padding:30px">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="countLabel" style="font-size:13px;color:var(--text-muted);margin-top:12px"></div>
  </div>
</main>

<!-- 商材追加・編集モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">商材追加</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>分類</label>
        <input type="text" id="f_category" placeholder="例：サジェスト対策、MEO対策、SEO対策" list="category-suggestions">
        <datalist id="category-suggestions"></datalist>
      </div>
      <div class="form-group full">
        <label>商材名 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="f_name" placeholder="例：Googleサジェスト消し放題【成果型】">
      </div>
      <div class="form-group full">
        <label>単価種別</label>
        <div style="display:flex;gap:20px;align-items:center;margin-top:4px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:normal">
            <input type="radio" name="price_type" id="pt_monthly" value="monthly" checked> 月額
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:normal">
            <input type="radio" name="price_type" id="pt_daily" value="daily"> 日額（×30日で月額推定）
          </label>
        </div>
      </div>
      <div class="form-group full">
        <label>単価（円）</label>
        <input type="number" id="f_unit_price" placeholder="0" min="0">
      </div>
      <div class="form-group full">
        <label>説明</label>
        <textarea id="f_description" placeholder="商材の説明・特徴など"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- CSV取込モーダル -->
<div class="modal-overlay" id="csvModalOverlay">
  <div class="modal" style="max-width:720px;width:95%">
    <div class="modal-header">
      <h3>商材CSV一括登録</h3>
      <button class="modal-close" onclick="closeCsvModal()">✕</button>
    </div>

    <div style="margin-bottom:16px;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div>
        <strong style="color:var(--text)">CSVフォーマット（1行目はヘッダー）</strong><br>
        <code style="font-size:12px">商材名,単価,単価種別,説明</code><br>
        ※ 単価種別は「月額」または「日額」。省略時は月額。分類は下で選択。
      </div>
      <button class="btn btn-ghost btn-sm" onclick="downloadCsvTemplate()" style="white-space:nowrap;display:flex;align-items:center;gap:5px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        ひな型DL
      </button>
    </div>

    <div class="form-grid" style="margin-bottom:16px">
      <div class="form-group full">
        <label>分類 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="csv_category" placeholder="例：サジェスト対策" list="csv-category-suggestions" style="flex:1">
        <datalist id="csv-category-suggestions"></datalist>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px" id="csvCategoryChips"></div>
      </div>
      <div class="form-group full">
        <label>CSVファイル</label>
        <input type="file" id="csvFile" accept=".csv" onchange="previewCSV()" style="padding:6px">
      </div>
    </div>

    <!-- プレビュー -->
    <div id="csvPreviewWrap" style="display:none">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)">
        プレビュー（<span id="csvPreviewCount">0</span>件）
      </div>
      <div style="overflow-x:auto;max-height:280px;border:1px solid var(--border);border-radius:6px">
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          <thead style="background:var(--bg);position:sticky;top:0">
            <tr>
              <th style="padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">商材名</th>
              <th style="padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">種別</th>
              <th style="padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)">単価</th>
              <th style="padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)">月額</th>
              <th style="padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">説明</th>
              <th style="padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">分類</th>
            </tr>
          </thead>
          <tbody id="csvPreviewBody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCsvModal()">キャンセル</button>
      <button class="btn btn-primary" id="csvImportBtn" onclick="importCSV()" disabled>取り込む</button>
    </div>
  </div>
</div>

<script>
let editId = null;
let allCategories = [];
const fmt = n => n != null && n !== '' ? '¥' + Number(n).toLocaleString() : '-';

function priceDisplay(p) {
  if (p.price_type === 'daily') {
    const monthly = (p.unit_price || 0) * 30;
    return {
      daily:   `<span style="font-weight:600;color:var(--primary)">${fmt(p.unit_price)}<small style="font-weight:normal;color:var(--text-muted)">/日</small></span>`,
      monthly: `<span style="font-weight:600;color:var(--primary)">${fmt(monthly)}</span><br><small style="color:var(--text-muted);font-size:11px">（30日成果）</small>`,
    };
  } else {
    return {
      daily:   `<span style="color:var(--text-muted)">-</span>`,
      monthly: `<span style="font-weight:600;color:var(--primary)">${fmt(p.unit_price)}<small style="font-weight:normal;color:var(--text-muted)">/月</small></span>`,
    };
  }
}

async function loadProducts() {
  const search   = document.getElementById('searchInput').value;
  const category = document.getElementById('categoryFilter').value;
  const params   = new URLSearchParams();
  if (search)   params.set('search', search);
  if (category) params.set('category', category);

  const data = await fetch('/api/products?' + params).then(r => r.json());
  const tbody = document.getElementById('tableBody');

  updateCategoryFilter(data);

  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center;padding:30px">商材が登録されていません</td></tr>';
  } else {
    let lastCategory = null;
    const rows = data.map(p => {
      const catCell = p.category !== lastCategory
        ? `<td rowspan="1" style="font-weight:700;color:var(--primary);white-space:nowrap">
             <span class="badge badge-blue">${p.category || '未分類'}</span>
           </td>`
        : `<td style="color:var(--text-muted);font-size:11px">　└</td>`;
      lastCategory = p.category;
      const { daily, monthly } = priceDisplay(p);
      return `
        <tr>
          ${catCell}
          <td><strong>${p.name}</strong></td>
          <td style="text-align:right">${daily}</td>
          <td style="text-align:right">${monthly}</td>
          <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)">${p.description || '-'}</td>
          <td style="color:var(--text-muted)">${p.created_at?.slice(0,10) || '-'}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-ghost btn-sm" onclick="editProduct(${p.id})">編集</button>
            <button class="btn btn-ghost btn-sm" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g,"&#39;")}')" style="color:var(--danger)">削除</button>
          </td>
        </tr>
      `;
    }).join('');
    tbody.innerHTML = rows;
  }
  document.getElementById('countLabel').textContent = `${data.length}件`;
}

function updateCategoryFilter(data) {
  const cats = [...new Set(data.map(p => p.category).filter(Boolean))].sort();
  const current = document.getElementById('categoryFilter').value;
  const sel = document.getElementById('categoryFilter');
  sel.innerHTML = '<option value="">すべての分類</option>' +
    cats.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join('');
  document.getElementById('category-suggestions').innerHTML =
    cats.map(c => `<option value="${c}">`).join('');
  allCategories = cats;
}

function openModal(id = null) {
  editId = id;
  clearForm();
  document.getElementById('modalTitle').textContent = id ? '商材編集' : '商材追加';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editId = null;
}

function clearForm() {
  ['f_category','f_name','f_unit_price','f_description'].forEach(id => document.getElementById(id).value = '');
}

async function editProduct(id) {
  const products = await fetch('/api/products').then(r => r.json());
  const p = products.find(x => x.id === id);
  if (!p) return;
  openModal(id);
  document.getElementById('f_category').value    = p.category || '';
  document.getElementById('f_name').value        = p.name || '';
  document.getElementById('f_unit_price').value  = p.unit_price || '';
  document.getElementById('f_description').value = p.description || '';
}

async function saveProduct() {
  const body = {
    category:    document.getElementById('f_category').value.trim(),
    name:        document.getElementById('f_name').value.trim(),
    unit_price:  parseInt(document.getElementById('f_unit_price').value) || 0,
    description: document.getElementById('f_description').value.trim(),
  };

  if (!body.name) { alert('商材名を入力してください'); return; }

  const url    = editId ? `/api/products/${editId}` : '/api/products';
  const method = editId ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();

  showAlert(data.message || '保存しました', res.ok ? 'success' : 'error');
  if (res.ok) { closeModal(); loadProducts(); }
}

async function deleteProduct(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
  const data = await res.json();
  showAlert(data.message, res.ok ? 'success' : 'error');
  if (res.ok) loadProducts();
}

function showAlert(msg, type = 'success') {
  const el = document.getElementById('alert');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 3000);
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ── CSV取込 ────────────────────────────────────────────────────────────────────

let csvParsedRows = [];

function openCsvModal() {
  csvParsedRows = [];
  document.getElementById('csvFile').value = '';
  document.getElementById('csv_category').value = '';
  document.getElementById('csvPreviewWrap').style.display = 'none';
  document.getElementById('csvImportBtn').disabled = true;
  document.getElementById('csv-category-suggestions').innerHTML =
    allCategories.map(c => `<option value="${c}">`).join('');
  renderCategoryChips();
  document.getElementById('csvModalOverlay').classList.add('open');
}

function closeCsvModal() {
  document.getElementById('csvModalOverlay').classList.remove('open');
}

function renderCategoryChips() {
  const wrap = document.getElementById('csvCategoryChips');
  if (!allCategories.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = allCategories.map(c =>
    `<span style="cursor:pointer;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--border);font-size:12px;color:var(--text)"
      onclick="document.getElementById('csv_category').value='${c.replace(/'/g,"\\'")}';previewCSV()">${c}</span>`
  ).join('');
}

function parseCSVClient(text) {
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { rows: [] };

  const parseRow = line => {
    const result = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
      else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    result.push(cur.trim());
    return result;
  };

  const HEADER_MAP = {
    '商材名':'name','名称':'name',
    '単価':'unit_price','価格':'unit_price','単価（円）':'unit_price',
    '説明':'description','備考':'description',
    '分類':'category',
  };

  const rawHeaders = parseRow(lines[0]);
  const headers = rawHeaders.map(h => HEADER_MAP[h] || h);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseRow(lines[i]);
    const row = {};
    headers.forEach((h, idx) => { row[h] = vals[idx] || ''; });
    if (row.name) rows.push(row);
  }
  return { rows };
}

function previewCSV() {
  const file = document.getElementById('csvFile').files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    const { rows } = parseCSVClient(e.target.result);
    csvParsedRows = rows;
    const defaultCat = document.getElementById('csv_category').value.trim();

    const tbody = document.getElementById('csvPreviewBody');
    tbody.innerHTML = rows.map(r => {
      const unitPrice = parseInt(String(r.unit_price || '0').replace(/[,，¥￥]/g, '')) || 0;
      const cat = r.category || defaultCat || '<span style="color:var(--danger)">未選択</span>';
      return `<tr>
        <td style="padding:7px 10px;border-bottom:1px solid var(--border)">${r.name}</td>
        <td style="padding:7px 10px;border-bottom:1px solid var(--border);text-align:right">${fmt(unitPrice)}</td>
        <td style="padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.description || '-'}</td>
        <td style="padding:7px 10px;border-bottom:1px solid var(--border)">${cat}</td>
      </tr>`;
    }).join('');

    document.getElementById('csvPreviewCount').textContent = rows.length;
    document.getElementById('csvPreviewWrap').style.display = rows.length ? 'block' : 'none';
    document.getElementById('csvImportBtn').disabled = rows.length === 0;
  };
  reader.readAsText(file, 'utf-8');
}

document.getElementById('csv_category').addEventListener('input', () => {
  if (csvParsedRows.length) previewCSV();
});

async function importCSV() {
  const category = document.getElementById('csv_category').value.trim();
  if (!category) { alert('分類を選択または入力してください'); return; }
  if (!csvParsedRows.length) { alert('CSVファイルを選択してください'); return; }

  const products = csvParsedRows.map(r => ({
    name:        r.name,
    unit_price:  parseInt(String(r.unit_price || '0').replace(/[,，¥￥]/g, '')) || 0,
    description: r.description || null,
  }));

  const btn = document.getElementById('csvImportBtn');
  btn.disabled = true;
  btn.textContent = '取り込み中...';

  const res = await fetch('/api/products/import-csv', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ category, products }),
  });
  const data = await res.json();

  btn.disabled = false;
  btn.textContent = '取り込む';

  showAlert(data.message || '取込完了', res.ok ? 'success' : 'error');
  if (res.ok) { closeCsvModal(); loadProducts(); }
}

function downloadCsvTemplate() {
  const bom = '\uFEFF';
  const header = '商材名,単価,説明';
  const sample = 'Googleサジェスト消し放題【成果型】,50000,成果報酬型のサジェスト対策';
  const csv = bom + header + '\n' + sample + '\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '商材取込ひな型.csv'; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('csvModalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('csvModalOverlay')) closeCsvModal();
});

loadProducts();
</script>
</body>
</html>
