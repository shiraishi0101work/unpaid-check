<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>未入金チェックシステム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 py-2">
  <span class="navbar-brand fw-bold">
    <i class="bi bi-currency-yen me-2"></i>未入金チェックシステム
  </span>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white-50 small" id="nav-clock"></span>
  </div>
</nav>

<div class="container-fluid px-4 py-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ 'success' if category == 'success' else 'danger' if category == 'error' else 'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 時計
  function updateClock() {
    const now = new Date();
    document.getElementById('nav-clock').textContent =
      now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP');
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
