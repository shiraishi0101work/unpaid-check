<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if setup_mode %}初回セットアップ{% else %}ログイン{% endif %} — 未入金チェックシステム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #f0f4f8; }
    .login-card {
      max-width: 420px;
      margin: 80px auto;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .login-header {
      background: linear-gradient(135deg, #1a3c5e 0%, #2563a8 100%);
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 28px 32px 24px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="login-card bg-white">
  <div class="login-header">
    <h5 class="fw-bold mb-1">未入金チェックシステム</h5>
    <small class="opacity-75">{% if setup_mode %}初回アカウント設定{% else %}ログイン{% endif %}</small>
  </div>
  <div class="p-4">
    {% if error %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
    </div>
    {% endif %}

    {% if setup_mode %}
    <p class="text-muted small mb-3">ログインに使用するメールアドレスとパスワードを設定してください。</p>
    <form method="POST" action="{{ url_for('setup') }}">
    {% else %}
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

      <div class="mb-3">
        <label class="form-label fw-semibold">メールアドレス</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" required autofocus
                 placeholder="example@company.com">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">
          {% if setup_mode %}パスワード（6文字以上）{% else %}パスワード{% endif %}
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="pw1" class="form-control" required
                 placeholder="パスワード">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePw('pw1', this)">
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>
      </div>

      {% if setup_mode %}
      <div class="mb-4">
        <label class="form-label fw-semibold">パスワード（確認）</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="confirm" id="pw2" class="form-control" required
                 placeholder="もう一度入力">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePw('pw2', this)">
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>
      </div>
      {% else %}
      <div class="mb-4"></div>
      {% endif %}

      <button type="submit" class="btn btn-primary w-100 fw-bold">
        {% if setup_mode %}
          <i class="bi bi-person-check me-1"></i>アカウントを作成してログイン
        {% else %}
          <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
        {% endif %}
      </button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon  = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye';        // 見えている → 目が開いている
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye-slash';  // 隠れている → 目が閉じている
  }
}
</script>
</body>
</html>
