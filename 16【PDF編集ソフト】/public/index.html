<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <span>PDF Tools</span>
      <h1>PDF Editor</h1>
    </div>
    <div class="sidebar-nav">
      <div class="nav-label">メニュー</div>
      <a href="/" class="nav-item active">
        <span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></span>
        <span>ダッシュボード</span>
      </a>
      <a href="/editor.html" class="nav-item">
        <span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></span>
        <span>PDFを編集</span>
      </a>
      <div class="nav-label">管理</div>
      <a href="/archive.html" class="nav-item">
        <span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg></span>
        <span>書類アーカイブ</span>
      </a>
      <a href="/images.html" class="nav-item">
        <span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></span>
        <span>画像ライブラリ</span>
      </a>
      <a href="/clients.html" class="nav-item">
        <span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></span>
        <span>取引先</span>
      </a>
      <a href="/templates.html" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></span><span>定型文</span></a>
      <a href="/my-company.html" class="nav-item">
        <span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span>
        <span>自社情報</span>
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="page-header flex-between">
      <div>
        <h2>ダッシュボード</h2>
        <p>PDFの編集・管理ができます</p>
      </div>
      <a href="/editor.html" class="btn btn-primary">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        新規PDF編集
      </a>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">保存書類</div>
        <div class="stat-value" id="stat-docs">—</div>
        <div class="stat-sub">アーカイブ合計</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">取引先</div>
        <div class="stat-value" id="stat-clients">—</div>
        <div class="stat-sub">登録取引先数</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">画像ライブラリ</div>
        <div class="stat-value" id="stat-images">—</div>
        <div class="stat-sub">登録画像数</div>
      </div>
    </div>

    <!-- Recent docs -->
    <div class="card">
      <div class="card-header">
        <h3>最近の書類</h3>
        <a href="/archive.html" class="btn btn-ghost btn-sm">すべて見る</a>
      </div>
      <div id="recent-docs" class="doc-grid">
        <p class="text-muted" style="padding:20px 0;grid-column:1/-1;">読み込み中...</p>
      </div>
    </div>
  </main>
</div>

<script>
async function loadStats() {
  const res = await fetch('/api/stats');
  const data = await res.json();
  document.getElementById('stat-docs').textContent    = data.doc_count;
  document.getElementById('stat-clients').textContent = data.client_count;
  document.getElementById('stat-images').textContent  = data.image_count;

  const grid = document.getElementById('recent-docs');
  if (!data.recent_docs.length) {
    grid.innerHTML = `<p class="text-muted" style="padding:20px 0;grid-column:1/-1;">書類がまだありません。<a href="/editor.html" style="color:var(--primary)">PDFを編集して保存</a>してください。</p>`;
    return;
  }
  grid.innerHTML = data.recent_docs.map(doc => `
    <a href="/archive.html" class="doc-card">
      <div class="doc-card-thumb">
        ${doc.thumbnail
          ? `<img src="${doc.thumbnail}" alt="">`
          : `<div class="pdf-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg></div>`}
      </div>
      <div class="doc-card-body">
        <div class="doc-card-title">${doc.title}</div>
        <div class="doc-card-meta">${doc.client_name || '取引先なし'} · ${doc.created_at.slice(0,10)}</div>
      </div>
    </a>
  `).join('');
}
loadStats();
</script>
</body>
</html>
