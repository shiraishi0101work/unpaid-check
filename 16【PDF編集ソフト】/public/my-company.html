</head>
<body>
<div class="layout">

  <main class="main">
    <div class="page-header">
      <h2>自社情報</h2>
      <p>エディターの「自社情報」パネルから、ここで登録した情報をPDFに差し込みできます</p>
    </div>

    <div id="alert-area"></div>

    <div class="grid-2">
      <!-- Main form -->
      <div class="card">
        <div class="card-header"><h3>会社情報</h3></div>
        <form id="company-form">
          <div class="form-grid">
            <div class="form-group full">
              <label>会社名</label>
              <input type="text" id="company_name" placeholder="株式会社〇〇">
            </div>
            <div class="form-group">
              <label>郵便番号</label>
              <input type="text" id="postal_code" placeholder="000-0000">
            </div>
            <div class="form-group full">
              <label>住所（本社）</label>
              <input type="text" id="address" placeholder="東京都〇〇区〇〇1-2-3">
            </div>
            <div class="form-group full">
              <label>住所（支店）</label>
              <input type="text" id="branch_address" placeholder="大阪府〇〇市〇〇2-3-4">
            </div>
            <div class="form-group">
              <label>電話番号</label>
              <input type="text" id="phone" placeholder="03-0000-0000">
            </div>
            <div class="form-group">
              <label>FAX</label>
              <input type="text" id="fax" placeholder="03-0000-0001">
            </div>
            <div class="form-group full">
              <label>メールアドレス</label>
              <input type="email" id="email" placeholder="info@example.com">
            </div>
            <div class="form-group full">
              <label>代表者名</label>
              <input type="text" id="representative" placeholder="山田 太郎">
            </div>
            <div class="form-group full">
              <label>銀行口座情報</label>
              <textarea id="bank_info" rows="3" placeholder="〇〇銀行 〇〇支店 普通 1234567&#10;口座名義: カ）〇〇"></textarea>
            </div>
            <div class="form-group full">
              <label>メモ</label>
              <textarea id="notes" rows="2" placeholder="備考など"></textarea>
            </div>
          </div>
          <div class="flex-end mt-4">
            <button type="submit" class="btn btn-primary">保存する</button>
          </div>
        </form>
      </div>

      <!-- Logo -->
      <div class="card" style="align-self:start">
        <div class="card-header"><h3>ロゴ画像</h3></div>
        <div id="logo-preview" style="margin-bottom:16px;min-height:80px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <p class="text-muted" style="font-size:12px">ロゴ未登録</p>
        </div>
        <div class="upload-zone" onclick="document.getElementById('logo-file').click()" style="padding:24px">
          <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="uploadLogo(event)">
          <p style="font-size:13px"><strong>クリック</strong>してロゴ画像をアップロード</p>
          <p style="font-size:11px;color:var(--text-muted);margin-top:4px">PNG / JPEG 対応</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
async function load() {
  const res = await fetch('/api/my-company');
  const d   = await res.json();
  ['company_name','postal_code','address','branch_address','phone','fax','email','representative','bank_info','notes'].forEach(k => {
    const el = document.getElementById(k);
    if (el) el.value = d[k] || '';
  });
  if (d.logo_path) {
    document.getElementById('logo-preview').innerHTML =
      `<img src="/api/my-company/logo/${d.logo_path}" style="max-height:120px;max-width:100%;object-fit:contain;padding:8px">`;
  }
}

document.getElementById('company-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {};
  ['company_name','postal_code','address','branch_address','phone','fax','email','representative','bank_info','notes'].forEach(k => {
    body[k] = document.getElementById(k).value;
  });
  const res = await fetch('/api/my-company', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.ok) showAlert('保存しました', 'success');
  else showAlert('保存に失敗しました', 'error');
});

async function uploadLogo(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/my-company/logo', { method: 'POST', body: fd });
  if (res.ok) {
    const d = await res.json();
    document.getElementById('logo-preview').innerHTML =
      `<img src="/api/my-company/logo/${d.logo_path}" style="max-height:120px;max-width:100%;object-fit:contain;padding:8px">`;
    showAlert('ロゴを保存しました', 'success');
  }
}

function showAlert(msg, type) {
  const area = document.getElementById('alert-area');
  area.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => area.innerHTML = '', 3000);
}

load();
</script>
</body>
</html>
