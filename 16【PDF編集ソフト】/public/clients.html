  <main class="main">
    <div class="page-header flex-between">
      <div>
        <h2>取引先</h2>
        <p>書類保存時に紐付ける取引先を管理します</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        取引先を追加
      </button>
    </div>

    <div id="alert-area"></div>

    <div class="card">
      <div class="toolbar" style="margin-bottom:16px">
        <div class="search-wrap">
          <span class="search-icon"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
          <input type="text" id="search" placeholder="会社名・担当者名で検索..." oninput="renderTable()">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>会社名</th>
              <th>担当者名</th>
              <th>電話番号</th>
              <th>メール</th>
              <th>登録日</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="6" class="text-muted">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">取引先を追加</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label>会社名 *</label>
        <input type="text" id="f-company_name" placeholder="株式会社〇〇">
      </div>
      <div class="form-group">
        <label>担当者名</label>
        <input type="text" id="f-contact_name" placeholder="山田 花子">
      </div>
      <div class="form-group">
        <label>担当者電話</label>
        <input type="text" id="f-contact_phone" placeholder="03-0000-0000">
      </div>
      <div class="form-group full">
        <label>担当者メール</label>
        <input type="email" id="f-contact_email" placeholder="hanako@example.com">
      </div>
      <div class="form-group">
        <label>郵便番号</label>
        <input type="text" id="f-postal_code" placeholder="000-0000">
      </div>
      <div class="form-group full">
        <label>住所</label>
        <input type="text" id="f-address" placeholder="東京都〇〇区〇〇">
      </div>
      <div class="form-group full">
        <label>メモ</label>
        <textarea id="f-notes" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="save()">保存する</button>
    </div>
  </div>
</div>

<script>
let allClients = [];
let editingId  = null;
const FIELDS = ['company_name','contact_name','contact_phone','contact_email','postal_code','address','notes'];

async function loadClients() {
  const res  = await fetch('/api/clients');
  allClients = await res.json();
  renderTable();
}

function renderTable() {
  const q    = document.getElementById('search').value.toLowerCase();
  const list = allClients.filter(c =>
    !q || c.company_name.toLowerCase().includes(q) || (c.contact_name || '').toLowerCase().includes(q)
  );
  const tbody = document.getElementById('table-body');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-muted">${q ? '検索結果がありません' : '取引先が登録されていません'}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(c => `
    <tr>
      <td><strong>${c.company_name}</strong></td>
      <td>${c.contact_name || '—'}</td>
      <td>${c.contact_phone || '—'}</td>
      <td>${c.contact_email || '—'}</td>
      <td class="text-muted">${c.created_at.slice(0,10)}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-xs" onclick="openEdit(${c.id})">編集</button>
          <button class="btn btn-danger btn-xs" onclick="del(${c.id},'${c.company_name.replace(/'/g,"\\'")}')">削除</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function openModal(id) {
  editingId = id || null;
  FIELDS.forEach(k => { document.getElementById('f-' + k).value = ''; });
  document.getElementById('modal-title').textContent = '取引先を追加';
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const c = allClients.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  FIELDS.forEach(k => { document.getElementById('f-' + k).value = c[k] || ''; });
  document.getElementById('modal-title').textContent = '取引先を編集';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function save() {
  const body = {};
  FIELDS.forEach(k => { body[k] = document.getElementById('f-' + k).value; });
  if (!body.company_name) { alert('会社名を入力してください'); return; }

  const url    = editingId ? `/api/clients/${editingId}` : '/api/clients';
  const method = editingId ? 'PUT' : 'POST';
  const res    = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (res.ok) {
    closeModal();
    showAlert('保存しました', 'success');
    loadClients();
  } else {
    showAlert('保存に失敗しました', 'error');
  }
}

async function del(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  await fetch(`/api/clients/${id}`, { method: 'DELETE' });
  showAlert('削除しました', 'success');
  loadClients();
}

function showAlert(msg, type) {
  const area = document.getElementById('alert-area');
  area.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => area.innerHTML = '', 3000);
}

loadClients();
</script>
</body>
