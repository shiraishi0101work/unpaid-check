<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF編集 — PDF Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="editor-page">

<!-- Loading overlay -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">処理中...</p>
</div>

<!-- ── UPLOAD SCREEN ── -->
<div id="upload-screen" class="editor-upload-screen">
  <div class="logo">PDF Editor</div>
  <div class="sub">PDFファイルをアップロードして編集を開始</div>
  <div class="upload-zone-lg" id="drop-zone">
    <input type="file" id="file-input" accept=".pdf,application/pdf" style="display:none">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
      </svg>
    </div>
    <h3>PDFをドラッグ＆ドロップ</h3>
    <p>またはクリックしてファイルを選択</p>
    <div class="formats">PDF形式のみ対応</div>
  </div>
  <div style="margin-top:20px;display:flex;gap:12px">
    <a href="/" class="btn btn-ghost btn-sm">← ホームへ戻る</a>
  </div>
</div>

<!-- ── EDITOR LAYOUT ── -->
<div class="editor-layout" id="editor-layout">

  <!-- Topbar -->
  <div class="editor-topbar">
    <a href="/" class="logo-area">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
      PDF Editor
    </a>
    <div class="divider"></div>
    <input type="text" id="doc-title" class="title-input" placeholder="書類タイトルを入力...">
    <div class="spacer"></div>

    <!-- Tools -->
    <div class="tool-group">
      <button class="tool-btn active" id="tool-select" title="選択/移動" onclick="setTool('select')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
      </button>
    </div>

    <div class="divider"></div>
    <button class="btn btn-ghost btn-sm" onclick="downloadPdf()">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      ダウンロード
    </button>
    <button class="btn btn-primary btn-sm" onclick="openArchiveModal()">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/></svg>
      アーカイブに保存
    </button>
  </div>

  <!-- Body -->
  <div class="editor-body">

    <!-- Left panel -->
    <div class="editor-left">
      <div class="panel-tabs">
        <div class="panel-tab active" data-tab="images" onclick="switchTab('images')">画像</div>
        <div class="panel-tab" data-tab="text" onclick="switchTab('text')">テキスト</div>
        <div class="panel-tab" data-tab="shapes" onclick="switchTab('shapes')">図形</div>
        <div class="panel-tab" data-tab="templates" onclick="switchTab('templates')">定型文</div>
      </div>

      <div class="panel-content">
        <!-- Images panel -->
        <div class="panel-section active" id="panel-images">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">PDFに画像を追加します</p>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label class="btn btn-outline" style="justify-content:center;cursor:pointer">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
              端末から画像を追加
              <input type="file" id="img-upload-direct" accept="image/*" style="display:none" onchange="addImageDirect(event)">
            </label>
          </div>
          <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px">ライブラリから選択</div>
          <div id="lib-images-grid" class="lib-image-grid">
            <p style="font-size:12px;color:var(--text-muted);grid-column:1/-1">読み込み中...</p>
          </div>
        </div>

        <!-- Text panel -->
        <div class="panel-section" id="panel-text">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">PDFにテキストを追加します</p>
          <div class="form-group" style="margin-bottom:12px">
            <label>テキスト内容</label>
            <textarea id="text-input" rows="3" placeholder="入力してください..."></textarea>
          </div>
          <div class="text-size-row">
            <label>サイズ</label>
            <input type="number" id="text-size" value="16" min="8" max="96" style="width:60px;padding:5px 8px">
            <label style="margin-left:8px">太字</label>
            <input type="checkbox" id="text-bold" style="width:auto;padding:0">
          </div>
          <div style="margin-bottom:12px">
            <label style="display:block;margin-bottom:8px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">色</label>
            <div class="color-swatches">
              <div class="color-swatch active" style="background:#000000" data-color="#000000" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#1e293b" data-color="#1e293b" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#dc2626" data-color="#dc2626" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#2563eb" data-color="#2563eb" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#059669" data-color="#059669" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#d97706" data-color="#d97706" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#7c3aed" data-color="#7c3aed" onclick="selectColor(this)"></div>
              <div class="color-swatch" style="background:#ffffff;border:1px solid #e2e8f0" data-color="#ffffff" onclick="selectColor(this)"></div>
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="addText()">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            テキストを追加
          </button>
        </div>

        <!-- Shapes panel -->
        <div class="panel-section" id="panel-shapes">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">図形を追加します</p>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-outline" onclick="addRect()">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/></svg>
              四角形
            </button>
            <button class="btn btn-outline" onclick="addLine()">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 12h16"/></svg>
              直線
            </button>
          </div>
          <div style="margin-top:16px">
            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">塗り/線の色</div>
            <div class="color-swatches" id="shape-color-swatches">
              <div class="color-swatch active" style="background:#000000" data-color="#000000" onclick="selectShapeColor(this)"></div>
              <div class="color-swatch" style="background:#dc2626" data-color="#dc2626" onclick="selectShapeColor(this)"></div>
              <div class="color-swatch" style="background:#2563eb" data-color="#2563eb" onclick="selectShapeColor(this)"></div>
              <div class="color-swatch" style="background:#059669" data-color="#059669" onclick="selectShapeColor(this)"></div>
              <div class="color-swatch" style="background:#d97706" data-color="#d97706" onclick="selectShapeColor(this)"></div>
            </div>
          </div>
        </div>

        <!-- Templates panel -->
        <div class="panel-section" id="panel-templates">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <p style="font-size:12px;color:var(--text-muted)">クリックでPDFに追加</p>
            <a href="/templates.html" target="_blank" style="font-size:11px;color:var(--primary);text-decoration:none">管理 →</a>
          </div>
          <!-- 検索 -->
          <input type="text" id="tmpl-search" placeholder="定型文を検索..." style="width:100%;padding:6px 10px;font-size:12px;margin-bottom:10px" oninput="renderTemplateList()">
          <div id="template-list" style="display:flex;flex-direction:column;gap:4px">
            <p style="font-size:12px;color:var(--text-muted)">読み込み中...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Canvas area -->
    <div class="editor-canvas-area" id="canvas-area">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>

    <!-- Right: properties -->
    <div class="editor-right" id="props-panel">
      <div class="no-selection" id="no-selection">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
        <p>オブジェクトを<br>選択してください</p>
      </div>
      <div id="object-props" style="display:none">
        <div class="prop-section">
          <h4>位置・サイズ</h4>
          <div class="prop-row">
            <label>X</label>
            <input type="number" id="prop-x" onchange="updateObjProp('left', this.value)">
          </div>
          <div class="prop-row">
            <label>Y</label>
            <input type="number" id="prop-y" onchange="updateObjProp('top', this.value)">
          </div>
          <div class="prop-row">
            <label>幅</label>
            <input type="number" id="prop-w" onchange="updateObjProp('scaleX', this.value / getActiveObjOrigW())">
          </div>
          <div class="prop-row">
            <label>高さ</label>
            <input type="number" id="prop-h" onchange="updateObjProp('scaleY', this.value / getActiveObjOrigH())">
          </div>
          <div class="prop-row">
            <label>回転</label>
            <input type="number" id="prop-angle" onchange="updateObjProp('angle', this.value)">
          </div>
        </div>
        <div class="prop-section" style="margin-top:12px">
          <h4>透明度</h4>
          <div class="prop-row">
            <input type="range" id="prop-opacity" min="0" max="100" step="1" oninput="updateObjProp('opacity', this.value/100); document.getElementById('prop-opacity-val').textContent=this.value+'%'">
            <span id="prop-opacity-val" style="font-size:12px;width:36px;text-align:right">100%</span>
          </div>
        </div>
        <div style="margin-top:16px">
          <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="deleteSelected()">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            削除
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Page navigation -->
  <div class="page-nav" id="page-nav">
    <button id="prev-btn" onclick="changePage(-1)" disabled>&#8592;</button>
    <span id="page-info">1 / 1</span>
    <button id="next-btn" onclick="changePage(1)" disabled>&#8594;</button>
  </div>
</div>

<!-- ── ARCHIVE MODAL ── -->
<div class="modal-overlay" id="archive-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>アーカイブに保存</h3>
      <button class="modal-close" onclick="closeArchiveModal()">×</button>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="form-group">
        <label>書類タイトル *</label>
        <input type="text" id="archive-title" placeholder="例: 見積書_山田商事_2024年4月">
      </div>
      <div class="form-group">
        <label>取引先（任意）</label>
        <select id="archive-client">
          <option value="">— 紐付けなし —</option>
        </select>
      </div>
      <div class="form-group">
        <label>メモ（任意）</label>
        <textarea id="archive-notes" rows="2" placeholder="備考があれば..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeArchiveModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveToArchive()">保存する</button>
    </div>
  </div>
</div>

<!-- PDF.js + Fabric.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="editor.js"></script>
</body>
</html>
