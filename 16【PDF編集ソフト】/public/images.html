  <main class="main">
    <div class="page-header flex-between">
      <div>
        <h2>画像ライブラリ</h2>
        <p>差し込み用画像を登録・管理します</p>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        画像を追加
      </button>
    </div>

    <div id="alert-area"></div>

    <!-- Search -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        <input type="text" id="search" placeholder="名前・タグで検索..." oninput="renderGrid()">
      </div>
    </div>

    <div id="images-grid" class="image-grid">
      <p class="text-muted">読み込み中...</p>
    </div>
  </main>
</div>

<!-- Add image modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>画像を追加</h3>
      <button class="modal-close" onclick="closeAddModal()">×</button>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="form-group">
        <label>画像ファイル *</label>
        <div class="upload-zone" id="img-drop-zone" onclick="document.getElementById('img-file').click()">
          <input type="file" id="img-file" accept="image/*" style="display:none" onchange="previewFile(event)">
          <div class="upload-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>
          <p><strong>クリックまたはドロップ</strong>して画像を選択</p>
          <div id="file-preview" style="margin-top:10px"></div>
        </div>
      </div>
      <div class="form-group">
        <label>画像名 *</label>
        <input type="text" id="img-name" placeholder="例: 会社ロゴ, 印鑑">
      </div>
      <div class="form-group">
        <label>タグ（任意）</label>
        <input type="text" id="img-tags" placeholder="ロゴ,印鑑,署名 など（カンマ区切り）">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="uploadImage()">保存する</button>
    </div>
  </div>
</div>

<script>
let allImages = [];

async function loadImages() {
  const res = await fetch('/api/images');
  allImages  = await res.json();
  renderGrid();
}

function renderGrid() {
  const q    = document.getElementById('search').value.toLowerCase();
  const list = allImages.filter(i =>
    !q || i.name.toLowerCase().includes(q) || (i.tags || '').toLowerCase().includes(q)
  );
  const grid = document.getElementById('images-grid');
  if (!list.length) {
    grid.innerHTML = `<p class="text-muted" style="grid-column:1/-1;padding:20px 0">${q ? '検索結果がありません' : '画像がまだ登録されていません'}</p>`;
    return;
  }
  grid.innerHTML = list.map(img => `
    <div class="image-card">
      <div class="image-card-thumb">
        <img src="/api/images/file/${img.file_name}" alt="${img.name}">
      </div>
      <div class="image-card-body">
        <div class="image-card-name">${img.name}</div>
        ${img.tags ? `<div class="image-card-tags">${img.tags}</div>` : ''}
        <div class="image-card-actions">
          <button class="btn btn-danger btn-xs" onclick="deleteImage(${img.id}, '${img.name.replace(/'/g,"\\'")}')">削除</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function deleteImage(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  await fetch(`/api/images/${id}`, { method: 'DELETE' });
  showAlert('削除しました', 'success');
  loadImages();
}

function openAddModal() {
  document.getElementById('img-name').value  = '';
  document.getElementById('img-tags').value  = '';
  document.getElementById('img-file').value  = '';
  document.getElementById('file-preview').innerHTML = '';
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}

function previewFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!document.getElementById('img-name').value) {
    document.getElementById('img-name').value = f.name.replace(/\.[^.]+$/, '');
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('file-preview').innerHTML = `<img src="${ev.target.result}" style="max-height:80px;max-width:200px;border-radius:4px">`;
  };
  reader.readAsDataURL(f);
}

async function uploadImage() {
  const name = document.getElementById('img-name').value.trim();
  const file = document.getElementById('img-file').files[0];
  if (!file) { alert('画像を選択してください'); return; }
  if (!name) { alert('画像名を入力してください'); return; }

  const fd = new FormData();
  fd.append('file', file);
  fd.append('name', name);
  fd.append('tags', document.getElementById('img-tags').value);

  const res = await fetch('/api/images', { method: 'POST', body: fd });
  if (res.ok) {
    closeAddModal();
    showAlert('保存しました', 'success');
    loadImages();
  } else {
    alert('保存に失敗しました');
  }
}

function showAlert(msg, type) {
  const area = document.getElementById('alert-area');
  area.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => area.innerHTML = '', 3000);
}

loadImages();
</script>
</body>
