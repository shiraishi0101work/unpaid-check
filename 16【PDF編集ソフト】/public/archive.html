<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書類アーカイブ — PDF Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><span>PDF Tools</span><h1>PDF Editor</h1></div>
    <div class="sidebar-nav">
      <div class="nav-label">メニュー</div>
      <a href="/" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></span><span>ダッシュボード</span></a>
      <a href="/editor.html" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></span><span>PDFを編集</span></a>
      <div class="nav-label">管理</div>
      <a href="/archive.html" class="nav-item active"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg></span><span>書類アーカイブ</span></a>
      <a href="/images.html" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></span><span>画像ライブラリ</span></a>
      <a href="/clients.html" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></span><span>取引先</span></a>
      <a href="/templates.html" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></span><span>定型文</span></a>
      <a href="/my-company.html" class="nav-item"><span class="nav-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span><span>自社情報</span></a>
    </div>

  <main class="main">
    <div class="page-header flex-between">
      <div>
        <h2>書類アーカイブ</h2>
        <p>保存したPDFを取引先別に管理します</p>
      </div>
      <a href="/editor.html" class="btn btn-primary">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        新規PDF編集
      </a>
    </div>

    <div id="alert-area"></div>

    <!-- Filter / Search -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        <input type="text" id="search" placeholder="書類タイトルで検索..." oninput="renderDocs()">
      </div>
      <select id="client-filter" onchange="renderDocs()" style="min-width:180px">
        <option value="">すべての取引先</option>
      </select>
    </div>

    <div id="docs-grid" class="doc-grid">
      <p class="text-muted" style="grid-column:1/-1;padding:20px 0">読み込み中...</p>
    </div>
  </main>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal wide">
    <div class="modal-header">
      <h3 id="detail-title">書類詳細</h3>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div style="display:flex;gap:20px">
      <div id="detail-thumb" style="width:160px;flex-shrink:0;background:var(--bg);border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;min-height:200px"></div>
      <div style="flex:1">
        <div class="form-grid" style="grid-template-columns:1fr 1fr">
          <div><span class="text-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">取引先</span><p id="detail-client" style="margin-top:4px">—</p></div>
          <div><span class="text-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">作成日</span><p id="detail-date" style="margin-top:4px">—</p></div>
          <div class="full"><span class="text-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">メモ</span><p id="detail-notes" style="margin-top:4px;white-space:pre-wrap">—</p></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="detail-delete-btn">削除</button>
      <button class="btn btn-ghost" onclick="closeDetail()">閉じる</button>
      <button class="btn btn-outline btn-sm" id="detail-download-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        ダウンロード
      </button>
    </div>
  </div>
</div>

<script>
let allDocs    = [];
let allClients = [];

async function loadData() {
  const [docsRes, clientsRes] = await Promise.all([fetch('/api/documents'), fetch('/api/clients')]);
  allDocs    = await docsRes.json();
  allClients = await clientsRes.json();

  const sel = document.getElementById('client-filter');
  sel.innerHTML = '<option value="">すべての取引先</option>' +
    allClients.map(c => `<option value="${c.id}">${c.company_name}</option>`).join('');

  renderDocs();
}

function renderDocs() {
  const q        = document.getElementById('search').value.toLowerCase();
  const clientId = document.getElementById('client-filter').value;
  const list     = allDocs.filter(d =>
    (!q || d.title.toLowerCase().includes(q)) &&
    (!clientId || String(d.client_id) === clientId)
  );

  const grid = document.getElementById('docs-grid');
  if (!list.length) {
    grid.innerHTML = `<p class="text-muted" style="grid-column:1/-1;padding:20px 0">${q || clientId ? '条件に合う書類がありません' : '書類がまだ保存されていません。<a href="/editor.html" style="color:var(--primary)">PDFを編集して保存</a>してください。'}</p>`;
    return;
  }
  grid.innerHTML = list.map(doc => `
    <div class="doc-card" onclick="openDetail(${doc.id})">
      <div class="doc-card-thumb">
        ${doc.thumbnail
          ? `<img src="${doc.thumbnail}" alt="">`
          : `<div class="pdf-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg></div>`}
      </div>
      <div class="doc-card-body">
        <div class="doc-card-title">${doc.title}</div>
        <div class="doc-card-meta">${doc.client_name || '取引先なし'} · ${doc.created_at.slice(0,10)}</div>
      </div>
    </div>
  `).join('');
}

function openDetail(id) {
  const doc = allDocs.find(d => d.id === id);
  if (!doc) return;

  document.getElementById('detail-title').textContent   = doc.title;
  document.getElementById('detail-client').textContent  = doc.client_name || '紐付けなし';
  document.getElementById('detail-date').textContent    = doc.created_at.slice(0,16).replace('T',' ');
  document.getElementById('detail-notes').textContent   = doc.notes || '—';

  const thumb = document.getElementById('detail-thumb');
  thumb.innerHTML = doc.thumbnail
    ? `<img src="${doc.thumbnail}" style="max-width:140px;max-height:180px;object-fit:contain;padding:8px">`
    : `<svg style="width:48px;height:48px;opacity:.3;color:var(--primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;

  document.getElementById('detail-download-btn').onclick = () => {
    window.location.href = `/api/documents/${id}/download`;
  };
  document.getElementById('detail-delete-btn').onclick = () => deleteDoc(id, doc.title);

  document.getElementById('detail-modal').classList.add('open');
}
function closeDetail() {
  document.getElementById('detail-modal').classList.remove('open');
}

async function deleteDoc(id, title) {
  if (!confirm(`「${title}」を削除しますか？`)) return;
  await fetch(`/api/documents/${id}`, { method: 'DELETE' });
  closeDetail();
  const area = document.getElementById('alert-area');
  area.innerHTML = `<div class="alert alert-success">削除しました</div>`;
  setTimeout(() => area.innerHTML = '', 3000);
  loadData();
}

loadData();
</script>
</body>
</html>
