  /api/v3/reports/trial_balance_bs:
    get:
      description: |-
        残高試算表の貸借対照表を取得します。<br />
        全ての項目の金額が0の勘定科目、補助科目と一部の決算書の項目は返却されません。<br />
        残高試算表の columns は
         
         - opening_balance(前期残高)
         - debit_amount(借方金額)
         - credit_amount(貸方金額)
         - closing_balance(期末残高)
         - ratio(構成比)

        が固定で返却されます。<br />

        また、未実現仕訳は含まれず、常に全部門合計で集計されます。<br />

        ratio(構成比) は分母が 0 の場合は算出不能として 0 ではなく null となります。<br />
      operationId: getReportsTrialBalanceBalanceSheet
      parameters:
        - description: |-
            会計年度を指定します。<br />
            指定しない場合は最新の会計年度が使用されます。
          example: 2022
          in: query
          name: fiscal_year
          required: false
          schema:
            type: integer
            x-go-type: uint64
        - description: |-
            対象会計年度の集計開始月を指定します。<br />
            `fiscal_year` と組み合わせて集計開始月を指定できます。<br />
            指定しない場合は会計年度の開始月が使用されます。
          in: query
          name: start_month
          required: false
          schema:
            example: 2
            type: integer
        - description: |-
            対象会計年度の集計終了月を指定します。<br />
            `fiscal_year` と組み合わせて集計終了月を指定できます。<br />
            指定しない場合は会計年度の終了月が使用されます。
          in: query
          name: end_month
          required: false
          schema:
            example: 2
            type: integer
        - description: 対象期間の開始日を指定します。
          in: query
          name: start_date
          required: false
          schema:
            example: '2022-04-01'
            format: date
            type: string
        - description: 対象期間の終了日を指定します。
          in: query
          name: end_date
          required: false
          schema:
            example: '2023-03-31'
            format: date
            type: string
        - description: 勘定科目に紐づく補助科目の金額を取得するかどうかを指定します。
          in: query
          name: with_sub_accounts
          required: false
          schema:
            default: false
            example: true
            type: boolean
        - description: |-
            税込で算出するかどうかを指定します。<br />
            「事業者設定＞経理方式」が「税抜（内税）」の場合のみ指定可能です。<br />
            「税込」および「税抜（別記）」の経理方式の場合、このパラメーターは無視されます。
          in: query
          name: include_tax
          required: false
          schema:
            default: false
            example: true
            type: boolean
        - description: |-
            対象の仕訳の種別を指定します。<br />
            `journal_entry`（通常仕訳）、`adjusting_entry`（決算整理仕訳）のいずれか一方、または両方を指定できます。<br />
            省略した場合は、両方の種別が対象になります。
          in: query
          name: journal_types
          required: false
          schema:
            example:
              - journal_entry
              - adjusting_entry
            items:
              enum:
                - journal_entry
                - adjusting_entry
              type: string
              x-go-type: string
            type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TBResponse'
          description: 成功
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getReportsTrialBalanceBalanceSheet_400_response'
          description: リクエストのパラメータが不正
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
          description: アクセストークンが設定されていない、不正、または失効済
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
          description: 認可されていない権限で利用ができない
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse429'
          description: rate limitによる制限対象
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
          description: 予期しないエラー
      security:
        - OAuth2:
            - mfc/accounting/report.read
      summary: 残高試算表の貸借対照表の取得
      tags:
        - TrialBalanceBalanceSheet
