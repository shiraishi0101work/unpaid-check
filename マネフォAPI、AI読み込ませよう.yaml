  - description: 証憑API
    name: Vouchers
  - description: 部門API
    name: Departments
  - description: 税区分API
    name: Taxes
  - description: 補助科目API
    name: SubAccounts
  - description: 残高試算表（BS）取得API
    name: TrialBalanceBalanceSheet
  - description: 残高試算表（PL）取得API
    name: TrialBalanceProfitLoss
  - description: 推移表（BS）取得API
