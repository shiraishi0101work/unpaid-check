        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
          description: 予期しないエラー
      security:
        - OAuth2:
            - mfc/accounting/journal.read
      summary: 仕訳一覧の取得
      tags:
        - Journals
    post:
