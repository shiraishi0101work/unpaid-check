          description: 会計年度
          example: 2024
          nullable: false
          type: integer
        prefecture:
          description: 都道府県
          example: 東京都
          nullable: false
          type: string
        business_types:
          description: |-
            事業種別<br />
             - "MANUFACTURING": 製造業
             - "EDUCATION": 教育
             - "MEDICAL_WELFARE": 医療/福祉
             - "INFORMATION_COMMUNICATION": 情報通信
             - "FOOD_SERVICE": 飲食業
             - "TRANSPORTATION": 運送業
             - "WHOLESALE": 卸売業
             - "RETAIL": 小売業
             - "FINANCE_INSURANCE": 金融保険業
             - "REAL_ESTATE": 不動産業
             - "SERVICES": サービス業
             - "OTHER": その他
             - "CONSTRUCTION": 建設業
          example:
            - RETAIL
          items:
            enum:
              - MANUFACTURING
              - EDUCATION
              - MEDICAL_WELFARE
              - INFORMATION_COMMUNICATION
              - FOOD_SERVICE
              - TRANSPORTATION
              - WHOLESALE
              - RETAIL
              - FINANCE_INSURANCE
              - REAL_ESTATE
              - SERVICES
              - OTHER
              - CONSTRUCTION
            type: string
          nullable: false
          type: array
        tax_method:
          description: |-
            課税形式<br />
             - "FREE": 免税事業者
             - "SIMPLE": 簡易課税
             - "PROPORTIONAL_ALLOCATION": 原則課税（一括比例配分方式）
             - "INDIVIDUAL_ALLOCATION": 原則課税（個別対応方式）
          enum:
            - FREE
            - SIMPLE
            - PROPORTIONAL_ALLOCATION
            - INDIVIDUAL_ALLOCATION
          example: SIMPLE
          nullable: false
          type: string
        accounting_method:
          description: |-
            経理方式<br />
            課税形式が免税事業者の場合は返却されません。
             - "TAX_INCLUDED": 税込
             - "TAX_EXCLUDED_SEPARATE": 税抜（別記）
             - "TAX_EXCLUDED_INCLUDED": 税抜（内税）
          enum:
            - TAX_INCLUDED
            - TAX_EXCLUDED_SEPARATE
            - TAX_EXCLUDED_INCLUDED
          example: TAX_INCLUDED
          nullable: true
          type: string
          x-omitempty: true
        sales_rounding_method:
          description: 売上の端数処理方法
