paths:
  /api/v3/accounts:
    get:
      deprecated: false
      description: 勘定科目を取得します。
      operationId: getAccounts
      parameters:
        - description: nil
          in: query
          name: available
          required: false
          schema:
            example: true
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: 成功
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
          description: リクエストのパラメータが不正
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
          description: アクセストークンが設定されていない、不正、または失効済
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
          description: 認可されていない権限で利用ができない
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse429'
          description: rate limitによる制限対象
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
          description: 予期しないエラー
      security:
        - OAuth2:
