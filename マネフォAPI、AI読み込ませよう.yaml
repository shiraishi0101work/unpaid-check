openapi: 3.0.3
info:
  contact:
    name: ca_public_api
    url: https://api-accounting.moneyforward.com
  description: |
    # 基本情報
    当社との提携パートナーを除き、個別のお問い合わせへの対応や技術サポートの提供は原則として行っておりませんので、あらかじめご了承ください。<br />

    # リリースノート
    APIの新機能や重要な変更は[リリースノート](/release-notes)でお知らせいたします。<br />
    最新情報を受け取るため、[RSSフィード](/rss.xml)の購読を推奨いたします。<br />

    # API仕様書のダウンロード
    生成AIへのインプット情報として本仕様書のテキスト情報(yaml形式)が必要な場合は<a download href="/v3/openapi.yaml">こちら</a>からダウンロードしてください。<br />

    # 認証
    全てのAPIは、OAuth 2.0 を 用いて認証と認可を行います。<br />
    OAuth 2.0に従って、アクセストークンを取得してください。<br />
    取得したアクセストークンを Bearer Tokenとして Authorization Headerに付与する事で、APIリクエストが可能になります。<br />

    # エラーレスポンス
    全てのAPIは3種類のステータスコード（2xx, 4xx, 5xx）を返却します。<br />
    4xx, 5xx の場合は共通のレスポンスフォーマットでエラー用のレスポンスボディを返却します。<br />
    エラーレスポンスにはエラーと同じ数の要素を含む配列が用意され、それぞれエラーの種別である code とエラー内容の message を含みます。<br />

    # Rate limiter
    [ドキュメントのリンク](/rate_limiter)
  title: CA PUBLIC REST API
  version: 3.0.0
servers:
  - description: 本番環境
    url: https://api-accounting.moneyforward.com
