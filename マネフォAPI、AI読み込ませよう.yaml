components:
  parameters:
    Available:
      description: nil
      in: query
      name: available
      required: false
      schema:
        example: true
        type: boolean
    JournalStartDate:
      description: 対象期間の開始日を指定します。各仕訳の取引日が基準になります。
      in: query
      name: start_date
      required: false
      schema:
        example: '2022-04-01'
        format: date
        type: string
    JournalEndDate:
      description: 対象期間の終了日を指定します。各仕訳の取引日が基準になります。
      in: query
      name: end_date
      required: false
      schema:
        example: '2023-03-31'
        format: date
        type: string
    AccountIDJournal:
      description: |-
        勘定科目ID<br />
        指定された勘定科目を借方貸方のいずれかに持つ仕訳のみが返却されます。
      in: query
      name: account_id
      required: false
      schema:
        type: string
    IsRealized:
      description: |-
        未実現の仕訳であるかを指定するフラグ<br />
        指定しない場合は全ての仕訳が返却されます。
      in: query
      name: is_realized
      required: false
      schema:
        example: false
        type: boolean
    Page:
      description: ページ番号
      in: query
      name: page
      required: false
      schema:
        default: 1
        example: 2
        minimum: 1
        type: integer
        x-go-type: uint64
    JournalsPerPage:
      description: 1ページあたりの件数
      in: query
      name: per_page
      required: false
      schema:
        default: 10
        example: 10
        maximum: 10000
        minimum: 1
        type: integer
        x-go-type: uint64
    Id:
      description: 必要なIDを指定します。
      in: path
      name: id
      required: true
      schema:
        type: string
    AccountIDSubAccount:
      description: 勘定科目ID
      in: query
      name: account_id
      required: false
      schema:
        type: string
    FiscalYearTB:
      description: |-
        会計年度を指定します。<br />
        指定しない場合は最新の会計年度が使用されます。
      example: 2022
      in: query
      name: fiscal_year
      required: false
      schema:
        type: integer
        x-go-type: uint64
    StartMonthTB:
      description: |-
        対象会計年度の集計開始月を指定します。<br />
        `fiscal_year` と組み合わせて集計開始月を指定できます。<br />
        指定しない場合は会計年度の開始月が使用されます。
      in: query
      name: start_month
      required: false
      schema:
        example: 2
        type: integer
    EndMonthTB:
      description: |-
        対象会計年度の集計終了月を指定します。<br />
        `fiscal_year` と組み合わせて集計終了月を指定できます。<br />
        指定しない場合は会計年度の終了月が使用されます。
      in: query
      name: end_month
      required: false
      schema:
        example: 2
        type: integer
    TrialBalanceStartDate:
      description: 対象期間の開始日を指定します。
      in: query
      name: start_date
      required: false
      schema:
        example: '2022-04-01'
        format: date
        type: string
    TrialBalanceEndDate:
      description: 対象期間の終了日を指定します。
      in: query
      name: end_date
      required: false
      schema:
        example: '2023-03-31'
        format: date
        type: string
    WithSubAccounts:
      description: 勘定科目に紐づく補助科目の金額を取得するかどうかを指定します。
      in: query
      name: with_sub_accounts
      required: false
      schema:
        default: false
        example: true
        type: boolean
    IncludeTax:
      description: |-
        税込で算出するかどうかを指定します。<br />
        「事業者設定＞経理方式」が「税抜（内税）」の場合のみ指定可能です。<br />
        「税込」および「税抜（別記）」の経理方式の場合、このパラメーターは無視されます。
      in: query
      name: include_tax
      required: false
      schema:
        default: false
        example: true
        type: boolean
    JournalTypes:
      description: |-
        対象の仕訳の種別を指定します。<br />
        `journal_entry`（通常仕訳）、`adjusting_entry`（決算整理仕訳）のいずれか一方、または両方を指定できます。<br />
        省略した場合は、両方の種別が対象になります。
      in: query
      name: journal_types
      required: false
      schema:
        example:
          - journal_entry
          - adjusting_entry
        items:
          enum:
            - journal_entry
            - adjusting_entry
          type: string
          x-go-type: string
        type: array
    TransitionType:
      description: |-
        推移表の集計タイプを指定します。<br />
        現在は 'monthly' のみがサポートされています。<br />
        - monthly: 月次集計
      in: query
      name: type
      required: true
      schema:
        enum:
          - monthly
        example: monthly
        type: string
    TransitionFiscalYear:
      description: |-
        会計年度を指定します。<br />
        指定しない場合は最新の会計年度が使用されます。
      example: 2021
      in: query
      name: fiscal_year
      required: false
      schema:
        type: integer
        x-go-type: uint64
    TransitionStartMonth:
      description: |-
        対象会計年度の集計開始月を指定します。<br />
        `fiscal_year` と組み合わせて集計開始月を指定できます。<br />
        指定しない場合は会計年度の開始月が使用されます。
      in: query
      name: start_month
      required: false
      schema:
        example: 2
        type: integer
    TransitionEndMonth:
      description: |-
        対象会計年度の集計終了月を指定します。<br />
        `fiscal_year` と組み合わせて集計終了月を指定できます。<br />
        指定しない場合は会計年度の終了月が使用されます。
      in: query
      name: end_month
      required: false
      schema:
        example: 2
        type: integer
