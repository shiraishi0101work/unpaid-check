  /api/v3/journals:
    get:
      deprecated: false
      description: |-
        会計期間や仕訳日付などの条件を指定して、仕訳一覧を取得します。<br />
        start_date または end_dateのいずれかを指定する必要があります。指定された日付が含まれる会計期間の仕訳のみが返却されます。
      operationId: getJournals
      parameters:
        - description: 対象期間の開始日を指定します。各仕訳の取引日が基準になります。
          in: query
          name: start_date
          required: false
          schema:
            example: '2022-04-01'
            format: date
            type: string
        - description: 対象期間の終了日を指定します。各仕訳の取引日が基準になります。
          in: query
          name: end_date
          required: false
          schema:
            example: '2023-03-31'
            format: date
            type: string
        - description: |-
            勘定科目ID<br />
            指定された勘定科目を借方貸方のいずれかに持つ仕訳のみが返却されます。
          in: query
          name: account_id
          required: false
          schema:
            type: string
        - description: |-
            未実現の仕訳であるかを指定するフラグ<br />
            指定しない場合は全ての仕訳が返却されます。
          in: query
          name: is_realized
          required: false
          schema:
            example: false
            type: boolean
        - description: ページ番号
          in: query
          name: page
          required: false
          schema:
            default: 1
            example: 2
            minimum: 1
            type: integer
            x-go-type: uint64
        - description: 1ページあたりの件数
          in: query
          name: per_page
          required: false
          schema:
            default: 10
            example: 10
            maximum: 10000
            minimum: 1
            type: integer
            x-go-type: uint64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJournalsResponse'
          description: 成功
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getJournals_400_response'
          description: リクエストのパラメータが不正
        '401':
